/* ข้อความไทย: ตัดบรรทัดตามวลี ไม่ตัดกลางคำ */
body,button,p,h1,h2,h3,span,small,div,label{word-break:keep-all;line-break:strict;overflow-wrap:normal}

#sub{max-width:100%}
/* การจัดเรียงข้อความ: ระยะบรรทัด ขนาด และการเว้นวรรคให้สม่ำเสมอทั้งเว็บ */
body{line-height:1.7;letter-spacing:0}
h1,h2,h3,.lt2,.bub,.brand-name{line-height:1.35}
h1,h2,h3{letter-spacing:-.2px}
p,.mut,.card p,.les small,.li small,.svc-c span,.car-slide .mut{line-height:1.65}
small,.gname,.eyebrow{letter-spacing:.2px}
.lt2,.bub,.mut,#sub,.brand-sub{text-wrap:pretty}
.car-slide .lt2{max-width:22ch}
.car-slide .mut{max-width:36ch}
.sh{margin-top:22px;margin-bottom:12px}
.card{padding:18px 18px}
.tab button span{letter-spacing:0}
/* แผ่นโฆษณา: หัวข้อและคำอธิบายขึ้นบรรทัดใหม่ ไม่ทับรูป และไม่ล้นกรอบ */
.car-slide .lt2{white-space:normal!important;max-width:none!important;padding-right:118px;font-size:20px;line-height:1.35}
.car-slide .mut{max-width:none!important;padding-right:118px;font-size:14px;line-height:1.6}
.car-slide{overflow:hidden}
/* คำอธิบายในไทล์เครื่องมือ: ขึ้นบรรทัดตามวลี ไม่ตัดกลางคำ */
.tile small{word-break:keep-all;overflow-wrap:normal;hyphens:none}
.tile b{word-break:keep-all;overflow-wrap:normal}
/* แผ่นโฆษณา: หัวข้อและคำอธิบายจำกัดไว้ 2 บรรทัดเสมอ และไม่ทับตัวการ์ตูน */
.car-slide .lt2{display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal!important;padding-right:118px;max-width:none!important}
.car-slide .mut{display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding-right:118px;max-width:none!important}
.car-slide .lt2 + .mut{margin-top:8px}
/* ภาษาไทยต้องมีระยะบรรทัดพอ ไม่ให้วรรณยุกต์ของบรรทัดบนชนบรรทัดล่าง */

h1,h2,h3,.lt2,.bub,.brand-name,.tile b,.card b,.les b,.li b,.svc-c b,.gname,.car-slide .lt2{line-height:1.55!important}
.car-slide .lt2{-webkit-line-clamp:2}
.car-slide .mut,.tile small,.card p,.les small,.li small,.svc-c span,#sub,.brand-sub{line-height:1.6!important}
.tile b{font-size:17px}
.tile{padding-bottom:16px}

.car-slide .lt2{margin-bottom:6px}
/* ป้ายโฆษณาไม่มีตัวการ์ตูน: ข้อความเต็มความกว้าง */
.car-slide .lt2,.car-slide .mut{padding-right:0!important}
/* เมนูหลัก: ป้ายไม่ทับกัน ระยะบรรทัดเพียงพอ และเว้นช่องระหว่างแถว */
.mgrid{row-gap:22px;column-gap:6px}
.mi{min-width:0;width:100%}
.mi .ml{font-size:13px;font-weight:600;line-height:1.6;min-height:3.2em;display:flex;align-items:flex-start;justify-content:center;text-align:center;overflow-wrap:normal;word-break:keep-all;width:100%;padding:0 2px}
.mi .ml span,.mi .ml{hyphens:none}
@media (min-width:700px){.mi .ml{font-size:14px;min-height:3em}}
/* แก้ข้อความทับกันจริง: คำอธิบายในแผ่นโฆษณาเว้นระยะกับลิงก์อ่านต่อ และแถบล่างทึบขึ้น */
.car-slide .mut{max-height:calc(2 * 1.6em + 2px);margin-bottom:10px}
.car-slide .mut + small{display:block;margin-top:4px}
.car-slide small{position:relative;z-index:1}
.tab{background:rgba(255,255,255,.97)!important}

/* แถบล่างซ่อนเมื่อเลื่อนลง และแสดงเมื่อเลื่อนขึ้น ไม่ให้ทับข้อความที่กำลังอ่าน */
.tab{transition:transform .3s ease,opacity .3s ease}
.tab.tab-hide{transform:translate(-50%,calc(100% + 40px))!important;opacity:0;pointer-events:none}
/* กล่องโฆษณา: สีไล่เฉดเคลื่อนไปมาอย่างนุ่มนวล (หยุดเมื่อเปิดโหมดลดการเคลื่อนไหว) */
.car-slide{background-size:300% 300%!important;animation:slideIn .6s ease both,colorDrift 9s ease-in-out infinite!important}
.car-slide:nth-child(2){animation-delay:0s,-2s!important}
.car-slide:nth-child(3){animation-delay:0s,-4s!important}
.car-slide:nth-child(4){animation-delay:0s,-6s!important}
.car-slide:nth-child(5){animation-delay:0s,-8s!important}
@keyframes colorDrift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){.car-slide{animation:none!important}}

/* ===== BaseLab Typography System: Inter (อังกฤษ/ตัวเลข) + IBM Plex Sans Thai (ไทย) ===== */
:root{
 --font-en:'Inter';--font-th:'IBM Plex Sans Thai';

}

html{font-synthesis:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body,button,input,select,textarea,label,table{font-family:var(--font-ui)}

/* หัวข้อ / หัวข้อรอง / เนื้อหา */

h3,h4,.sect,.sh h3,.fl,.eyebrow,.gname,label{font-weight:var(--fw-sub)}
h3{font-size:var(--fs-h3)}

p,small,li,td{font-weight:var(--fw-body)}

.brand-name,.top .brand b{font-weight:var(--fw-logo);letter-spacing:-.2px}

function calcS(a,b,B,op){

 const B4=()=>{const a=B3();if(t[i]=='→'){i++;const b=B3();if(t[i]=='→')X('ใช้ → ต่อกันหลายตัวต้องใส่วงเล็บ');return{k:'b',o:'→',l:a,r:b}}return a};
 const B5=()=>{let a=B4();while(t[i]=='↔'){i++;a={k:'b',o:'↔',l:a,r:B4()}}return a};
 if(!t.length)X('กรุณาใส่นิพจน์');const n=B5();if(i<t.length)X('พบสัญลักษณ์ที่ใช้ไม่ได้: '+t[i]);return n}
const lev=(n,e)=>n.k=='v'?e[n.n]:n.k=='n'?!lev(n.a,e):n.o=='∧'?lev(n.l,e)&&lev(n.r,e):n.o=='∨'?lev(n.l,e)||lev(n.r,e):n.o=='→'?!lev(n.l,e)||lev(n.r,e):lev(n.l,e)===lev(n.r,e);
const lsh=(n,top)=>{if(n.k=='v')return n.n;if(n.k=='n')return'~'+lsh(n.a);const s=lsh(n.l)+n.o+lsh(n.r);return top?s:'('+s+')'};
const lvs=(n,o=new Set)=>(n.k=='v'?o.add(n.n):n.k=='n'?lvs(n.a,o):(lvs(n.l,o),lvs(n.r,o)),o);
const lsubs=(n,o=[])=>{if(n.k=='n')lsubs(n.a,o);else if(n.k=='b'){lsubs(n.l,o);lsubs(n.r,o)}if(n.k!='v'&&!o.some(x=>lsh(x,1)==lsh(n,1)))o.push(n);return o};
const lrows=v=>[...Array(2**v.length).keys()].map(k=>Object.fromEntries(v.map((c,j)=>[c,!(k>>(v.length-1-j)&1)])));

function ttHtml(src,extra){const n=lparse(src),v=[...'pqrs'].filter(c=>lvs(n).has(c));if(!v.length)throw new Error('ต้องมีตัวแปร p q r หรือ s อย่างน้อย 1 ตัว');const cols=n.k=='v'?[n]:lsubs(n),R=lrows(v);
 const all=R.map(e=>cols.map(c=>lev(c,e)));const fin=all.map(r=>r[r.length-1]);
 const tb=`<div class="tblwrap"><table class="t tt"><tr>${v.map(c=>`<th>${c}</th>`).join('')}${cols.map((c,j)=>`<th class="${j==cols.length-1?'fin':''}">${E(lsh(c,1))}</th>`).join('')}</tr>${R.map((e,k)=>`<tr>${v.map(c=>`<td>${TF(e[c])}</td>`).join('')}${all[k].map((x,j)=>`<td class="${j==cols.length-1?'fin':''}">${TF(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 const kind=fin.every(x=>x)?'เป็นจริงทุกกรณี จึงเป็นสัจนิรันดร์':fin.every(x=>!x)?'เป็นเท็จทุกกรณี':'มีทั้งจริงและเท็จ จึงไม่เป็นสัจนิรันดร์';
 return `<section class="card"><h2>ตารางค่าความจริงของ ${E(lsh(n,1))}</h2><p>มีตัวแปร ${v.length} ตัว จึงมี 2<sup>${v.length}</sup> = ${R.length} กรณี</p>${tb}<p class="box">ผลลัพธ์${kind}</p></section>`}
function eqHtml(a,b){const x=lparse(a),y=lparse(b),v=[...'pqrs'].filter(c=>lvs(x).has(c)||lvs(y).has(c)),ok=lrows(v).every(e=>lev(x,e)===lev(y,e));
 return `<section class="card"><h2>ตรวจการสมมูล</h2><p><b>${E(lsh(x,1))}</b> กับ <b>${E(lsh(y,1))}</b> ${ok?'<span class="good">สมมูลกัน ✓</span> (ค่าความจริงเหมือนกันทุกกรณี)':'ไม่สมมูลกัน (มีบางกรณีที่ค่าความจริงต่างกัน)'}</p></section>`}
function miniTable(ex){const R=lrows(['p','q']),N=ex.map(lparse);return `<div class="tblwrap"><table class="t tt"><tr><th>p</th><th>q</th>${ex.map(x=>`<th>${E(x)}</th>`).join('')}</tr>${R.map(e=>`<tr><td>${TF(e.p)}</td><td>${TF(e.q)}</td>${N.map(n=>`<td>${TF(lev(n,e))}</td>`).join('')}</tr>`).join('')}</table></div>`}
function ttView(){const[a,b]=tte;let out='';try{if(a.trim()){out=ttHtml(a);if(b.trim())out+=eqHtml(a,b)}}catch(x){out=`<p class="bad">${E(x.message)}</p>`}
 return `<section class="card"><h2>สร้างตารางค่าความจริง</h2><label for="te">นิพจน์ (ใช้ตัวแปร p q r s)</label><input id="te" value="${E(a)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="เช่น (p∧q)→r"><label for="te2" style="margin-top:10px">นิพจน์ที่ 2 (ไม่บังคับ ใช้ตรวจการสมมูล)</label><input id="te2" value="${E(b)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="เช่น ~p∨q"><div class="chips">${['p','q','r','s','~','∧','∨','→','↔','(',')','⌫'].map(c=>`<button class="chip" data-a="ti" data-s="${c}" aria-label="แทรก ${c}">${c}</button>`).join('')}</div><div class="row"><button class="btn" data-a="ttgo">สร้างตาราง</button><button class="btn s" data-a="ttclr">ล้างข้อมูล</button></div><p class="mut">ลำดับการคำนวณ: ~ → ∧ → ∨ → → → ↔ (วงเล็บก่อน) ถ้าใช้ ∧ ร่วมกับ ∨ ต้องใส่วงเล็บ พิมพ์ -> หรือ <-> แทน → และ ↔ ได้</p></section><div id="tout">${out}</div>`}

const LG=[
['ประพจน์',()=>`<p><b>ประพจน์</b> คือประโยคบอกเล่าหรือปฏิเสธที่บอกได้ว่า <b>จริงหรือเท็จอย่างใดอย่างหนึ่งเท่านั้น</b></p><div class="box">ประพจน์: “แมวมีสี่ขา”, “พระอาทิตย์ขึ้นทางทิศตะวันตก”, “2 + 7 > 5”</div><div class="box">ไม่เป็นประพจน์: คำสั่ง คำถาม ขอร้อง อุทาน เช่น “จงแก้สมการ 2x + 3 = 8”, “ว้าย ช่วยด้วย”</div><p>ประโยคที่มีตัวแปรแล้วแทนค่าได้ทั้งจริงและเท็จ เช่น “x + 3 &lt; 5” หรือ “เขาเป็นนักคณิตศาสตร์” ก็ไม่เป็นประพจน์</p>`,[]],
['ค่าความจริง',()=>`<p>ค่าความจริงมี 2 ชนิด คือ <b>T</b> (จริง) และ <b>F</b> (เท็จ)</p><div class="box">“3 เป็นจำนวนเฉพาะ” → T<br>“{1,3,5} − {1,7,8} = {3,5,7,8}” → F (ที่ถูกคือ {3,5})<br>“รากที่ 3 ของ −8 เท่ากับ −2” → T<br>“7 เป็นคำตอบของ x² + 1 = 50” → T (49 + 1 = 50)<br>“3⁵⁵ มีหลักหน่วยเป็น 1” → F (หลักหน่วยของ 3ⁿ วน 3, 9, 7, 1 และ 55 หาร 4 เหลือเศษ 3 จึงลงท้าย 7)</div>`,[]],
['ตัวเชื่อมประพจน์',()=>`<p>ใช้ p, q, r, … แทนประพจน์ และใช้ตัวเชื่อม 5 ตัว</p><div class="tblwrap"><table class="t"><tr><th>ตัวเชื่อม</th><th>อังกฤษ</th><th>สัญลักษณ์</th></tr><tr><td>ไม่, ไม่ใช่ (นิเสธ)</td><td>Not</td><td>~</td></tr><tr><td>และ, แต่</td><td>And</td><td>∧</td></tr><tr><td>หรือ</td><td>Or</td><td>∨</td></tr><tr><td>ถ้า … แล้ว …</td><td>If … then</td><td>→</td></tr><tr><td>… ก็ต่อเมื่อ …</td><td>If and only if</td><td>↔</td></tr></table></div><div class="box">“ถ้า 8 เป็นจำนวนคู่ แล้ว √8 เป็นจำนวนเต็ม” เขียนเป็น p→q<br>“2 ≠ −2 หรือ 3 + 4 = 10” เขียนเป็น p∨q</div>`,[]],
['ค่าความจริงของตัวเชื่อม',()=>`${miniTable(['~p','p∧q','p∨q','p→q','p↔q'])}<div class="box"><b>∧</b> จริงเพียงกรณีเดียว คือ T∧T<br><b>∨</b> เท็จเพียงกรณีเดียว คือ F∨F<br><b>→</b> เท็จเพียงกรณีเดียว คือ T→F (ตัวหน้าเป็น F หรือตัวหลังเป็น T จะจริงเสมอ)<br><b>↔</b> จริงเมื่อสองประพจน์มีค่าความจริงเหมือนกัน</div>`,[['p→q','']]],
['ลำดับความสำคัญของตัวเชื่อม',()=>`<p>หาค่าในวงเล็บก่อน แล้วคำนวณตามลำดับ <b>~, ∧, ∨, →, ↔</b> (~ ผูกแน่นที่สุด ↔ ครอบคลุมที่สุด)</p><div class="box">ตัวอย่าง: “ถ้า 1+3&lt;5 และ 5&gt;9 ดังนั้น 2⁰=1 หรือ 1⁻⁵=1”<br>p = T, q = F, r = T, s = T เขียนเป็น (p∧q)→(r∨s)<br>p∧q = F, r∨s = T จึงได้ F→T = <b>T</b></div><p>เอกสารบางหน้าให้ ∧ กับ ∨ มีลำดับเท่ากัน เครื่องมือในแอปนี้ใช้ ∧ ก่อน ∨ (เหมือน JavaScript) และให้ใส่วงเล็บเมื่อใช้ปนกันเพื่อไม่ให้กำกวม</p>`,[['(p∧q)→(r∨s)','']]],
['ตารางค่าความจริง',()=>`<p>ถ้ามีประพจน์ย่อย n ตัว จะมี <b>2ⁿ</b> กรณี (1 ตัว = 2, 2 ตัว = 4, 3 ตัว = 8) เขียนคอลัมน์ตัวแปรก่อน แล้วคำนวณประพจน์ย่อยจากในวงเล็บออกมา คอลัมน์สุดท้ายคือผลลัพธ์</p>${miniTable(['~p','~p∨q'])}<p>ลองสร้างตารางของนิพจน์อื่นได้ที่เมนู “ตารางค่าความจริง”</p>`,[['(p∨q)∧(r→q)','']]],
['การสมมูลของประพจน์',()=>`<p>ประพจน์สองประพจน์ <b>สมมูลกัน (≡)</b> เมื่อมีค่าความจริงเหมือนกันทุกกรณี ตรวจโดยสร้างตารางค่าความจริงเทียบกัน</p><div class="box">${LAW.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</div>`,[['p→q','~p∨q'],['~(p∧q)','~p∨~q']]],
['นิเสธของประพจน์',()=>`<p>นิเสธของ p คือ ~p มีค่าความจริงตรงข้ามกันทุกกรณี</p><div class="box">~(p∧q) ≡ ~p∨~q<br>~(p∨q) ≡ ~p∧~q<br>~(p→q) ≡ p∧~q<br>~(p↔q) ≡ p↔~q</div><div class="box">ตัวอย่าง: “ถ้า 2+4=6 แล้ว 2×3=6” อยู่ในรูป p→q<br>นิเสธคือ p∧~q: “2+4=6 และ 2×3≠6”</div>`,[['~(p→q)','p∧~q']]],
['สัจนิรันดร์',()=>`<p><b>สัจนิรันดร์</b> คือรูปแบบประพจน์ที่เป็นจริงทุกกรณี ตรวจได้ 2 วิธี</p><div class="box">1) สร้างตารางค่าความจริง ถ้าคอลัมน์สุดท้ายเป็น T ทั้งหมดคือสัจนิรันดร์<br>2) สมมติว่าเป็น F แล้วหาค่าประพจน์ย่อย ถ้าขัดแย้งกันแสดงว่าเป็นเท็จไม่ได้ จึงเป็นสัจนิรันดร์ ถ้าไม่ขัดแย้งก็ไม่เป็น</div><p>ตัวอย่าง [(p→q)∧(q→r)]→(p→r) เป็นสัจนิรันดร์ (ถ้า p→r เป็น F ต้องได้ p = T, r = F แต่ p→q และ q→r เป็น T ทำให้ q ต้องเป็นทั้ง T และ F จึงขัดแย้ง) ส่วน [p∧(q∨r)]∨[~p∨(q∨r)] ไม่เป็นสัจนิรันดร์ เพราะเป็น F ได้เมื่อ p = T, q = F, r = F</p>`,[['[(p→q)∧(q→r)]→(p→r)',''],['[p∧(q∨r)]∨[~p∨(q∨r)]','']]],
['การอ้างเหตุผล',()=>`<p>การอ้างเหตุผลมี <b>เหตุ</b> (P₁, P₂, …) และ <b>ผล</b> (C) จะ <b>สมเหตุสมผล</b> เมื่อ (P₁∧P₂∧…)→C เป็นสัจนิรันดร์ นั่นคือถ้าเหตุจริงทั้งหมด ผลต้องจริง</p><div class="box">1. เหตุจริง–ผลจริง: p→q, p ⊢ q<br>2. ผลเท็จ–เหตุเท็จ: p→q, ~q ⊢ ~p<br>3. ถ่ายทอด: p→q, q→r ⊢ p→r<br>4. ตัดออก: p∨q, ~p ⊢ q<br>5. การลด: p∧q ⊢ p (หรือ q)<br>6. การเพิ่ม: p ⊢ p∨q<br>7. Constructive: p→r, q→s, p∨q ⊢ r∨s<br>8. Destructive: p→r, q→s, ~r∨~s ⊢ ~p∨~q</div><div class="box">“ถ้านารีขยัน แล้วนารีสอบได้ที่ 1; นารีสอบได้ที่ 1; ดังนั้นนารีขยัน” คือ [(p→q)∧q]→p ไม่เป็นสัจนิรันดร์ (p = F, q = T) จึง <b>ไม่สมเหตุสมผล</b></div>`,[['[(p→q)∧q]→p',''],['[(p→q)∧(q→r)∧~r]→~p','']]],
['ประโยคเปิดและตัวบ่งปริมาณ',()=>`<p><b>ประโยคเปิด</b> คือประโยคที่มีตัวแปร เมื่อแทนค่าด้วยสมาชิกในเอกภพสัมพัทธ์ (U) แล้วได้ประพจน์ ตัวบ่งปริมาณมี 2 ชนิด</p><div class="box"><b>∀x</b> อ่านว่า “สำหรับทุก x”<br><b>∃x</b> อ่านว่า “มี x อย่างน้อยหนึ่งตัว”</div><div class="box">“จำนวนจริง x ทุกจำนวนทำให้ x − 3 &gt; 10” → ∀x[x − 3 &gt; 10]; U = R<br>“มีจำนวนนับ x ที่ x − 1 = 0” → ∃x[x − 1 = 0]; U = N</div><p>ถ้า U เป็นเซตของสัตว์ทั้งหมด “นกทุกตัวมีปีก” = ∀x[x เป็นนก → x มีปีก] และ “นกบางตัวบินได้” = ∃x[x เป็นนก ∧ x บินได้]</p>`,[]],
['ค่าความจริงของประโยคที่มีตัวบ่งปริมาณ',()=>`<div class="box">∀x[P(x)] จริง เมื่อ P(a) จริงทุกค่า (พบเท็จตัวเดียวก็เท็จ)<br>∃x[P(x)] จริง เมื่อมี a อย่างน้อยหนึ่งตัวที่ P(a) จริง (พบจริงตัวเดียวก็จริง)</div><div class="math-display">∀x ∃y (y &gt; x)</div><p>ตัวอย่างเมื่อ U = R: สำหรับทุก x เลือก y = x + 1 ได้เสมอ จึงมี y ที่มากกว่า x</p><div class="box">∀x[x + 3 &lt; 6]; U = {1,2,3,4} → <b>F</b> (x = 4 ได้ 7 &lt; 6 เป็นเท็จ)<br>∃x[x + x = x²]; U = {−1,0,1,2} → <b>T</b> (x = 0)<br>∀x ∃y (x + y ≠ 3); U = {0,1,2,4} → <b>T</b> (ทุก x หา y ได้)<br>∃x ∀y (x + y ≠ 3); U = {0,1,2,4} → <b>T</b> (x = 0 เพราะไม่มี y = 3 ใน U)</div><p>กรณี 2 ตัว ให้พิจารณาทีละตัวจากซ้ายไปขวา เช่น ∀x ∃y: แทน x ทีละค่า แล้วดูว่า ∃y เป็นจริงทุกค่า x หรือไม่</p>`,[]],
['การสมมูลและนิเสธของตัวบ่งปริมาณ',()=>`<div class="box">~∀x[P(x)] ≡ ∃x[~P(x)]<br>~∃x[P(x)] ≡ ∀x[~P(x)]</div><p>สำหรับตัวบ่งปริมาณ 2 ตัว ให้เปลี่ยน ∀ เป็น ∃ และ ∃ เป็น ∀ ทุกตัว แล้วใส่ ~ หน้าประโยคเปิด</p><div class="box">~∀x∀y[P] ≡ ∃x∃y[~P]<br>~∀x∃y[P] ≡ ∃x∀y[~P]<br>~∃x∃y[P] ≡ ∀x∀y[~P]<br>~∃x∀y[P] ≡ ∀x∃y[~P]</div><div class="box">นิเสธของ ∀x[x &gt; 2] คือ ∃x[x ≤ 2]<br>นิเสธของ “นักเรียนทุกคนสอบผ่าน” คือ “มีนักเรียนบางคนสอบไม่ผ่าน”<br>นิเสธของ ∃x[x + 2 ≥ 0] คือ ∀x[x + 2 &lt; 0]</div><p>ประโยคเปิดสมมูลกันได้เหมือนประพจน์ เช่น ∀x[P(x)→Q(x)] ≡ ∀x[~Q(x)→~P(x)] ≡ ∀x[~P(x)∨Q(x)]</p>`,[]],
['ตรรกศาสตร์กับการเขียนโปรแกรม',()=>`<div class="tblwrap"><table class="t"><tr><th>ตรรกศาสตร์</th><th>JavaScript</th></tr><tr><td>~p</td><td>!p</td></tr><tr><td>p∧q</td><td>p &amp;&amp; q</td></tr><tr><td>p∨q</td><td>p || q</td></tr><tr><td>p→q</td><td>!p || q</td></tr><tr><td>p↔q</td><td>p === q (เมื่อเป็น boolean)</td></tr></table></div><p>ลำดับใน JavaScript คือ <b>!</b> ก่อน <b>&amp;&amp;</b> ก่อน <b>||</b> ตรงกับลำดับ ~, ∧, ∨ ในบทเรียน</p><div class="code">if (age >= 18 &amp;&amp; hasId) { /* ผ่าน */ }\n!(a &amp;&amp; b) === (!a || !b)   // กฎของเดอมอร์แกน</div><p><b>Short-circuit:</b> false &amp;&amp; f() ไม่เรียก f() และ true || f() ก็ไม่เรียก f() เพราะผลแน่นอนแล้ว (เหมือน F∧q เป็น F เสมอ และ T∨q เป็น T เสมอ)</p><p><b>ตัวบ่งปริมาณ:</b> ∀ ตรงกับ every และ ∃ ตรงกับ some</p><div class="code">[1,2,3,4].every(x => x + 3 &lt; 6)  // false  (∀)\n[-1,0,1,2].some(x => x + x === x*x) // true   (∃)</div><p>ข้อควรระวัง: อาร์เรย์ว่าง every ได้ true และ some ได้ false</p>`,[['p→q','!p||q'],['~(p∧q)','!p||!q']]]];

{q:'ข้อใดสมมูลกับ p→q',o:['q→p','~p∨q','p∧~q','~q→p'],a:1,ex:'p→q ≡ ~p∨q (ตรวจด้วยตารางค่าความจริงได้ในเมนูตารางค่าความจริง)'},

// Matrix lessons and quiz module for BaseLab.
const MATRIX_LESSONS=[
{th:{t:'รู้จักเมทริกซ์และมิติ',p:'เมทริกซ์คือการจัดเรียงตัวเลขเป็นแถวและหลัก คล้ายตารางข้อมูล ใช้เก็บข้อมูลและคำนวณหลายค่าพร้อมกันได้',s:[['อ่านตำแหน่งให้ถูกต้อง','เมทริกซ์ A = [[2, 5, 1], [4, 0, 3]] มี 2 แถว และ 3 หลัก จึงมีมิติ 2 × 3 อ่านแถวก่อนหลักเสมอ\nสมาชิก a₂₃ อยู่แถวที่ 2 หลักที่ 3 ดังนั้น a₂₃ = 3'],['นึกภาพการใช้งาน','แถวอาจแทนจังหวัด\nส่วนหลักแทนชนิดสินค้า ตัวเลขในช่องคือราคาหรือจำนวนขาย\nเมื่อจัดข้อมูลเป็นเมทริกซ์ จะคำนวณทั้งชุดได้อย่างเป็นระบบ']]},en:{t:'Matrices and dimensions',p:'A matrix arranges numbers in rows and columns, like a data table. This lets us store and calculate many values together.',s:[['Read a position','A = [[2, 5, 1], [4, 0, 3]] has 2 rows and 3 columns, so its dimension is 2 × 3. Read the row first, then the column. The entry a₂₃ is in row 2, column 3, so a₂₃ = 3.'],['Why use matrices?','Rows might represent provinces and columns product types. Each entry can hold a price or a quantity. A matrix lets us work with the whole data set in an organized way.']]}},
{th:{t:'ชนิดของเมทริกซ์',p:'ดูจำนวนแถว จำนวนหลัก และรูปแบบของสมาชิก เพื่อระบุชนิดของเมทริกซ์ให้ถูกต้อง',s:[['รูปทรงพื้นฐาน','เมทริกซ์แถวมี 1 แถว เช่น [1 2 3]\nเมทริกซ์หลักมี 1 หลัก\nเขียนได้เป็น [1, 2, 3]ᵀ\nเมทริกซ์จัตุรัสมีจำนวนแถวเท่ากับจำนวนหลัก'],['รูปแบบพิเศษ','เมทริกซ์ศูนย์มีทุกช่องเป็น 0\nเมทริกซ์ทแยงมุมเป็นเมทริกซ์จัตุรัสที่ช่องนอกแนวทแยงเป็น 0\nเมทริกซ์สเกลาร์คือเมทริกซ์ทแยงมุมที่สมาชิกบนแนวทแยงเท่ากันทั้งหมด\nเมทริกซ์เอกลักษณ์ I มี 1 บนแนวทแยงและ 0 ที่ตำแหน่งอื่น'],['เมทริกซ์สามเหลี่ยม','เมทริกซ์สามเหลี่ยมบนมีศูนย์อยู่ใต้แนวทแยง\nส่วนเมทริกซ์สามเหลี่ยมล่างมีศูนย์อยู่เหนือแนวทแยง ทั้งสองชนิดต้องเป็นเมทริกซ์จัตุรัส']]},en:{t:'Common matrix types',p:'Identify a matrix by its shape and by where its entries are zero or equal.',s:[['Basic shapes','A row matrix has one row, such as [1 2 3]. A column matrix has one column, such as [1; 2; 3]. A square matrix has the same number of rows and columns.'],['Special patterns','A zero matrix contains only zeros. A diagonal matrix is square with zeros off the main diagonal. A scalar matrix is a diagonal matrix whose diagonal entries are all equal. The identity matrix I has ones on the diagonal and zeros elsewhere.'],['Triangular matrices','An upper triangular matrix has zeros below the diagonal. A lower triangular matrix has zeros above the diagonal. Both are square matrices.']]}},
{th:{t:'เท่ากัน บวก ลบ และคูณด้วยจำนวน',p:'การบวกและลบทำทีละตำแหน่ง จึงต้องจัดให้สมาชิกในตำแหน่งเดียวกันตรงกันก่อน',s:[['เท่ากันเมื่อไร','A และ B\nเท่ากันเมื่อมีมิติเดียวกันและสมาชิกทุกตำแหน่งเท่ากัน เช่น [[1,2],[3,4]] = [[1,2],[3,4]] แต่ถ้ามิติต่างกันย่อมไม่เท่ากัน'],['บวกและลบ','ทำได้เมื่อมิติเท่ากัน แล้วบวกหรือลบสมาชิกในตำแหน่งเดียวกัน เช่น [[1,2],[3,4]] + [[5,6],[7,8]] = [[6,8],[10,12]]'],['คูณด้วยสเกลาร์','นำจำนวน k คูณสมาชิกทุกช่อง เช่น 2[[1,−3],[0,4]] = [[2,−6],[0,8]] การกระจายใช้ได้เช่นเดียวกับพีชคณิต คือ k(A+B)=kA+kB']]},en:{t:'Equality, addition, subtraction, and scalars',p:'Addition and subtraction happen entry by entry, so matching positions must line up.',s:[['When are matrices equal?','A and B are equal only if they have the same dimensions and every matching entry is equal. Matrices of different sizes can never be equal.'],['Add and subtract','The dimensions must match. Then add or subtract entries in the same positions. Example: [[1,2],[3,4]] + [[5,6],[7,8]] = [[6,8],[10,12]].'],['Multiply by a scalar','Multiply every entry by k. For example, 2[[1,−3],[0,4]] = [[2,−6],[0,8]]. The distributive rule still works: k(A+B)=kA+kB.']]}},
{th:{t:'คูณเมทริกซ์ทีละขั้น',p:'การคูณเมทริกซ์ไม่ได้คูณสมาชิกในตำแหน่งเดียวกัน แต่นำแถวของเมทริกซ์ตัวหน้าคูณกับหลักของเมทริกซ์ตัวหลัง',s:[['ตรวจขนาดก่อน','ถ้า A มีมิติ m×n และ B มีมิติ n×p จะคูณ AB ได้ และผลลัพธ์มีมิติ m×p จำนวนหลักของ A ต้องเท่ากับจำนวนแถวของ B'],['คูณแถวกับหลัก','ตัวอย่าง A=[[1,2],[3,4]] และ B=[[2,0],[1,5]] ช่องแถวที่ 1 หลักที่ 1 คือ 1×2+2×1=4 ช่องแถวที่ 1 หลักที่ 2 คือ 1×0+2×5=10\nเมื่อทำครบทุกช่องจะได้ AB=[[4,10],[10,20]]'],['ระวังลำดับการคูณ','โดยทั่วไป AB ≠ BA และบางครั้งคูณได้เพียงลำดับเดียว เช่น (2×3)(3×1) คูณได้ แต่ (3×1)(2×3) คูณไม่ได้ ควรตรวจมิติก่อนคำนวณทุกครั้ง']]},en:{t:'Matrix multiplication step by step',p:'Matrix multiplication is not entry-by-entry. Pair each row of the first matrix with each column of the second.',s:[['Check dimensions first','If A is m×n and B is n×p, then AB is defined and has dimension m×p. The inner dimensions must match.'],['Row times column','Let A=[[1,2],[3,4]] and B=[[2,0],[1,5]]. Entry (1,1) is 1×2+2×1=4, and entry (1,2) is 1×0+2×5=10. Continuing gives AB=[[4,10],[10,20]].'],['Order matters','In general AB ≠ BA, and sometimes only one order is defined. For example, (2×3)(3×1) works, but (3×1)(2×3) does not. Always check dimensions first.']]}},
{th:{t:'นำเมทริกซ์ไปใช้กับข้อมูล',p:'เมื่อมีข้อมูลหลายชนิดและหลายพื้นที่ การคูณเมทริกซ์ช่วยรวมยอดได้ในขั้นตอนเดียว',s:[['ตัวอย่างรายรับ','สมมุติขายผลไม้ 3 ชนิด จำนวน [500, 900, 400] หน่วย และมีตารางราคาของ 4 จังหวัด ให้จัดราคาของแต่ละจังหวัดเป็นแถว จะได้เมทริกซ์ราคาขนาด 4×3 แล้วคูณกับเวกเตอร์จำนวนขนาด 3×1'],['แปลผลลัพธ์','ผลคูณมีมิติ 4×1 จึงได้รายรับ 1 ค่าต่อจังหวัด แต่ละค่าคือผลรวมของ ราคา × จำนวน ของผลไม้ทั้งสามชนิดในจังหวัดนั้น'],['แนวคิดสำคัญ','มิติบอกจำนวนแถวของผลลัพธ์\nส่วนการจับคู่แถวกับหลักทำให้ผลรวมแต่ละค่าตรงกับจังหวัดและสินค้า ควรตรวจหน่วยและการจัดเรียงข้อมูลก่อนคูณ เพื่อป้องกันการสลับแถวกับหลัก']]},en:{t:'Use matrices with real data',p:'When data contains several products and locations, matrix multiplication can total everything in one operation.',s:[['Revenue example','Suppose quantities for three fruits are [500, 900, 400]. Put the prices for four provinces in a 4×3 matrix, one province per row, then multiply by the 3×1 quantity vector.'],['Interpret the result','The product is 4×1, giving one revenue total per province. Each total is the dot product of that province’s price row and the quantities: add price × quantity for all three fruits.'],['Key idea','Dimensions tell you how many output rows you get. Matching each row with the quantity column keeps each total tied to the right province. Check the units and layout before multiplying.']]}},
{th:{t:'ทรานสโพสและเมทริกซ์สมมาตร',p:'ทรานสโพสคือการสลับแถวกับหลัก เขียนแทนด้วย Aᵀ',s:[['สลับแถวกับหลัก','ถ้า A=[[1,2,3],[4,5,6]] แล้ว Aᵀ=[[1,4],[2,5],[3,6]] เมทริกซ์มิติ 2×3 จึงกลายเป็นมิติ 3×2'],['สมมาตรและปฏิสมมาตร','เมทริกซ์จัตุรัสเป็นสมมาตรเมื่อ Aᵀ=A เช่น [[1,2],[2,3]] และเป็นปฏิสมมาตรเมื่อ Aᵀ=−A ซึ่งสมาชิกบนแนวทแยงต้องเป็น 0 เช่น [[0,2],[−2,0]]'],['กฎที่ใช้บ่อย','(Aᵀ)ᵀ=A; (A+B)ᵀ=Aᵀ+Bᵀ; (AB)ᵀ=BᵀAᵀ โดยเมื่อทรานสโพสผลคูณต้องสลับลำดับการคูณ; และ (kA)ᵀ=kAᵀ']]},en:{t:'Transpose and symmetric matrices',p:'The transpose swaps rows and columns. It is written Aᵀ.',s:[['Swap rows and columns','If A=[[1,2,3],[4,5,6]], then Aᵀ=[[1,4],[2,5],[3,6]]. A 2×3 matrix becomes 3×2.'],['Symmetric and skew-symmetric','A square matrix is symmetric when Aᵀ=A, such as [[1,2],[2,3]]. It is skew-symmetric when Aᵀ=−A; its diagonal entries must be zero, as in [[0,2],[−2,0]].'],['Useful rules','(Aᵀ)ᵀ=A; (A+B)ᵀ=Aᵀ+Bᵀ; (AB)ᵀ=BᵀAᵀ, so the order reverses; and (kA)ᵀ=kAᵀ.']]}},
{th:{t:'ดีเทอร์มิแนนต์และการผกผัน',p:'เมทริกซ์ผกผันทำหน้าที่ย้อนการคูณ เหมือนกับ 1/a ที่ย้อนการคูณด้วย a',s:[['เมทริกซ์เอกลักษณ์','I ไม่เปลี่ยนค่าของเมทริกซ์เมื่อคูณ เช่น AI=IA=A\nเมทริกซ์ผกผัน A⁻¹ จึงต้องทำให้ AA⁻¹=A⁻¹A=I'],['ตรวจ 2×2','สำหรับ A=[[a,b],[c,d]]\nดีเทอร์มิแนนต์คือ det(A)=ad−bc\nถ้าไม่เป็นศูนย์ A มีอินเวอร์ส แต่ถ้าเป็นศูนย์ A เรียกว่าเอกฐานและไม่มีอินเวอร์ส'],['กรณี 1×1','เมทริกซ์ [a] มีอินเวอร์สเป็น [1/a]\nเมื่อ a≠0 เช่น [5]⁻¹=[1/5] ซึ่งสอดคล้องกับอินเวอร์สของจำนวนทั่วไป']]},en:{t:'Determinants and invertibility',p:'An inverse matrix reverses multiplication, much like 1/a reverses multiplication by a.',s:[['Identity matrix','I does not change a matrix: AI=IA=A. The inverse A⁻¹ is defined by AA⁻¹=A⁻¹A=I.'],['Check a 2×2 matrix','For A=[[a,b],[c,d]], det(A)=ad−bc. If this is nonzero, A is invertible. If it is zero, A is singular and has no inverse.'],['The 1×1 case','The inverse of [a] is [1/a] when a≠0. For example, [5]⁻¹=[1/5], just like an ordinary number.']]}},
{th:{t:'หาอินเวอร์สและใช้กฎให้ถูกต้อง',p:'สูตรอินเวอร์สคำนวณได้โดยตรงสำหรับเมทริกซ์ 2×2 ส่วนเมทริกซ์ขนาดใหญ่ใช้การลดแถว',s:[['สูตร 2×2','ถ้า A=[[a,b],[c,d]] และ ad−bc≠0 แล้ว A⁻¹=1/(ad−bc)[[d,−b],[−c,a]] คือสลับ a กับ d เปลี่ยนเครื่องหมายของ b และ c แล้วหารด้วยดีเทอร์มิแนนต์'],['ตัวอย่าง','A=[[2,1],[1,1]] มี det=2×1−1×1=1 ดังนั้น A⁻¹=[[1,−1],[−1,2]]\nตรวจได้โดยคูณ A กับ A⁻¹ จะได้ I'],['กฎของอินเวอร์ส','(A⁻¹)⁻¹=A; (AB)⁻¹=B⁻¹A⁻¹ โดยสลับลำดับ; (Aᵀ)⁻¹=(A⁻¹)ᵀ; (Aⁿ)⁻¹=(A⁻¹)ⁿ; และ (kA)⁻¹=(1/k)A⁻¹\nเมื่อ k≠0']]},en:{t:'Find inverses and use their rules',p:'The formula gives a direct inverse for 2×2 matrices. Larger matrices use row reduction.',s:[['The 2×2 formula','If A=[[a,b],[c,d]] and ad−bc≠0, then A⁻¹=1/(ad−bc)[[d,−b],[−c,a]]. Swap a and d, change the signs of b and c, then divide by the determinant.'],['Example','For A=[[2,1],[1,1]], det=2×1−1×1=1, so A⁻¹=[[1,−1],[−1,2]]. Multiplying A by this inverse gives I.'],['Inverse rules','(A⁻¹)⁻¹=A; (AB)⁻¹=B⁻¹A⁻¹ (the order reverses); (Aᵀ)⁻¹=(A⁻¹)ᵀ; (Aⁿ)⁻¹=(A⁻¹)ⁿ; and (kA)⁻¹=(1/k)A⁻¹ when k≠0.']]}},
{th:{t:'แปลงแถวและหาอินเวอร์สแบบเกาส์–จอร์แดน',p:'การลดแถวค่อย ๆ เปลี่ยนเมทริกซ์ให้อยู่ในรูปที่อ่านคำตอบได้ โดยใช้การแปลงแถวแบบเดียวกันตลอด',s:[['การแปลงแถวสามแบบ','(1) สลับแถว (2) คูณแถวด้วยจำนวนที่ไม่เป็นศูนย์ (3)\nนำพหุคูณของแถวหนึ่งไปบวกเข้าอีกแถวหนึ่ง การแปลงเหล่านี้ไม่เปลี่ยนชุดคำตอบของระบบสมการ'],['เมทริกซ์มูลฐาน','เริ่มจาก I แล้วทำการแปลงแถวหนึ่งครั้ง จะได้เมทริกซ์มูลฐาน E\nเมื่อคูณ E ทางซ้ายของ A จะได้ผลเท่ากับทำการแปลงแถวนั้นกับ A'],['หาอินเวอร์ส','เขียน [A|I] คู่กันแล้วลดแถวทั้งแผง\nถ้าด้านซ้ายกลายเป็น I ด้านขวาคือ A⁻¹ คือ [A|I] → [I|A⁻¹] แต่ถ้าด้านซ้ายไม่สามารถลดเป็น I ได้ แสดงว่า A ไม่มีอินเวอร์ส']]},en:{t:'Row operations and Gauss–Jordan inverse',p:'Row reduction gradually puts a matrix into a form where the answer is visible. Apply each row operation consistently.',s:[['Three row operations','(1) Swap two rows. (2) Multiply a row by a nonzero number. (3) Add a multiple of one row to another. These operations preserve the solution set of a linear system.'],['Elementary matrices','Start with I and perform one row operation to get an elementary matrix E. Multiplying on the left, EA, applies that same row operation to A.'],['Find an inverse','Write [A|I] side by side and row-reduce the entire block. If the left side becomes I, the right side is A⁻¹: [A|I] → [I|A⁻¹]. If the left side cannot become I, A is not invertible.']]}},
{th:{t:'แก้ระบบสมการด้วย AX=B',p:'เขียนสมการหลายตัวให้อยู่ในรูปเมทริกซ์ แล้วใช้ A⁻¹ หาค่าตัวแปรทั้งหมดพร้อมกัน',s:[['จัดรูปก่อน','ระบบ x+y=5 และ 2x−y=1\nเขียนได้เป็น [[1,1],[2,−1]][[x],[y]]=[[5],[1]] หรือ AX=B'],['หาคำตอบ','เมื่อ A มีอินเวอร์ส คูณทั้งสองข้างทางซ้ายด้วย A⁻¹ จะได้ A⁻¹AX=A⁻¹B จึงได้ X=A⁻¹B และคำตอบมีเพียงชุดเดียว'],['ตัวอย่างการคำนวณ','จากระบบข้างต้น det(A)=−3 และ A⁻¹=1/(−3)[[−1,−1],[−2,1]]\nเมื่อคูณกับ B จะได้ X=[[2],[3]] ดังนั้น x=2 และ y=3\nตรวจแทนค่า: 2+3=5 และ 4−3=1'],['เมื่อใช้วิธีนี้ไม่ได้','ถ้า A ไม่มีอินเวอร์ส\nสูตรนี้ใช้ไม่ได้\nระบบอาจไม่มีคำตอบหรือมีคำตอบจำนวนมาก ต้องวิเคราะห์ด้วยการลดแถวแทน']]},en:{t:'Solve systems using AX=B',p:'Write a system of equations as a matrix equation, then use A⁻¹ to solve for all variables together.',s:[['Set up the equation','The system x+y=5 and 2x−y=1 becomes [[1,1],[2,−1]][[x],[y]]=[[5],[1]], or AX=B.'],['Solve','When A is invertible, multiply both sides on the left by A⁻¹: A⁻¹AX=A⁻¹B, so X=A⁻¹B. The solution is unique.'],['Worked result','Here det(A)=−3 and A⁻¹=1/(−3)[[−1,−1],[−2,1]]. Multiplying by B gives X=[[2],[3]], so x=2 and y=3. Check: 2+3=5 and 4−3=1.'],['When this method does not apply','If A is not invertible, this inverse formula cannot be used. The system may have no solution or infinitely many solutions, so use row reduction to analyze it.']]}}
];
const MATRIX_QUIZ=[
{q:['A=[[2,5,1],[4,0,3]] มีมิติเท่าไร?','What are the dimensions of A=[[2,5,1],[4,0,3]]?'],o:[['2×3','3×2','2×2','3×3'],['2×3','3×2','2×2','3×3']],a:0,x:['มี 2 แถวและ 3 หลัก อ่านแถวก่อนหลัก','It has 2 rows and 3 columns; rows come first.']},
{q:['จากเมทริกซ์ในข้อก่อน a₂₃ คือเท่าไร?','For the previous matrix, what is a₂₃?'],o:[['0','3','4','5'],['0','3','4','5']],a:1,x:['แถว 2 หลัก 3 มีค่า 3','Row 2, column 3 contains 3.']},
{q:['เงื่อนไขที่ทำให้ A=B คืออะไร?','When are A and B equal?'],o:[['มีดีเทอร์มิแนนต์เท่ากัน','They have the same determinant'],['มิติและสมาชิกทุกตำแหน่งเท่ากัน','Same dimensions and every matching entry equal'],['มีจำนวนสมาชิกเท่ากัน','Same number of entries'],['เป็นเมทริกซ์จัตุรัสทั้งคู่','Both are square'],['They have the same determinant','Same dimensions and every matching entry equal','Same number of entries','Both are square']],a:1,x:['ต้องมีขนาดเท่ากันและค่าทุกช่องตรงกัน','They must have matching dimensions and entries.']},
{q:['เมทริกซ์ 2×3 บวกกับ 2×2 ได้หรือไม่?','Can a 2×3 matrix be added to a 2×2 matrix?'],o:[['ได้','Yes'],['ไม่ได้','No']],a:1,x:['การบวกต้องมีมิติเท่ากัน','Addition requires equal dimensions.']},
{q:['3[[1,−2],[0,4]] ได้ผลลัพธ์ข้อใด?','What is 3[[1,−2],[0,4]]?'],o:[['[[3,−6],[0,12]]','[[3,−2],[0,4]]','[[1,−6],[0,12]]','[[3,−6],[3,12]]'],['[[3,−6],[0,12]]','[[3,−2],[0,4]]','[[1,−6],[0,12]]','[[3,−6],[3,12]]']],a:0,x:['คูณทุกสมาชิกด้วย 3','Multiply every entry by 3.']},
{q:['A ขนาด 2×3 คูณ B ขนาดใดได้?','What size of B can be multiplied by A of size 2×3?'],o:[['2×2','3×4','4×3','2×3'],['2×2','3×4','4×3','2×3']],a:1,x:['จำนวนหลักของ A ต้องเท่าจำนวนแถวของ B คือ 3','A has 3 columns, so B must have 3 rows.']},
{q:['ผลคูณ (2×3)(3×4) มีมิติเท่าไร?','What are the dimensions of (2×3)(3×4)?'],o:[['2×4','3×3','4×2','คูณไม่ได้ / Undefined'],['2×4','3×3','4×2','Undefined']],a:0,x:['เอามิติด้านนอก เหลือ 2×4','Keep the outer dimensions: 2×4.']},
{q:['ข้อความใดถูกต้องเกี่ยวกับ AB และ BA?','Which statement about AB and BA is true?'],o:[['เท่ากันเสมอ','Always equal'],['AB นิยามได้เสมอเมื่อ BA นิยามได้','If BA is defined, AB is always defined'],['โดยทั่วไป AB ไม่เท่ากับ BA','In general, AB is not equal to BA'],['สลับลำดับได้เสมอ','The order can always be swapped']],a:2,x:['การคูณเมทริกซ์ไม่สลับที่ และบางครั้งมีเพียงลำดับเดียวที่คูณได้','Matrix multiplication is not commutative; sometimes only one order is defined.']},
{q:['ถ้า A=[[1,2],[3,4]], B=[[2,0],[1,5]] ค่า AB คือ?','If A=[[1,2],[3,4]], B=[[2,0],[1,5]], find AB.'],o:[['[[4,10],[10,20]]','[[2,0],[3,20]]','[[4,0],[10,20]]','[[3,10],[7,15]]'],['[[4,10],[10,20]]','[[2,0],[3,20]]','[[4,0],[10,20]]','[[3,10],[7,15]]']],a:0,x:['ใช้แถวคูณหลัก เช่นช่องแรก 1×2+2×1=4','Use row-by-column dot products; the first entry is 1×2+2×1=4.']},
{q:['ถ้าราคา 4 จังหวัด × สินค้า 3 ชนิด คูณจำนวนสินค้า 3×1 ผลลัพธ์แทนอะไร?','A 4×3 price matrix times a 3×1 quantity vector gives what?'],o:[['ราคา 3 รายการ','Three prices'],['รายรับ 4 จังหวัด','Revenue for four provinces'],['จำนวนสินค้า 12 ค่า','Twelve quantities'],['คูณไม่ได้','Undefined']],a:1,x:['มิติผลลัพธ์คือ 4×1 จึงเป็นยอดรายรับของแต่ละจังหวัด','The result is 4×1: one revenue total per province.']},
{q:['เมทริกซ์ 2×3 เมื่อทรานสโพสเป็นมิติใด?','What dimensions does a 2×3 matrix have after transposing?'],o:[['2×3','3×2','2×2','3×3'],['2×3','3×2','2×2','3×3']],a:1,x:['ทรานสโพสสลับแถวและหลัก','Transpose swaps rows and columns.']},
{q:['เมทริกซ์สมมาตรมีสมบัติใด?','What defines a symmetric matrix?'],o:[['Aᵀ=A','Aᵀ=A'],['Aᵀ=−A','Aᵀ=−A'],['A=0','A=0'],['det(A)=0','det(A)=0']],a:0,x:['นิยามของเมทริกซ์สมมาตรคือทรานสโพสแล้วได้ตัวเดิม','A symmetric matrix equals its transpose.']},
{q:['สมาชิกแนวทแยงของเมทริกซ์ปฏิสมมาตรต้องเป็นอย่างไร?','What must diagonal entries of a skew-symmetric matrix be?'],o:[['เป็น 1','Equal 1'],['เป็น 0','Equal 0'],['เป็นบวก','Be positive'],['เท่ากันทุกตัว','All equal']],a:1,x:['จาก aᵢᵢ=−aᵢᵢ จึงได้ aᵢᵢ=0','Since aᵢᵢ=−aᵢᵢ, each diagonal entry is zero.']},
{q:['สำหรับ A=[[a,b],[c,d]] ดีเทอร์มิแนนต์คือ?','For A=[[a,b],[c,d]], what is the determinant?'],o:[['ad−bc','ad−bc'],['ab−cd','ab−cd'],['ac−bd','ac−bd'],['a+b+c+d','a+b+c+d']],a:0,x:['สูตร 2×2 คือผลคูณแนวทแยงหลักลบผลคูณแนวทแยงรอง','For 2×2, multiply the main diagonal and subtract the other diagonal product.']},
{q:['ถ้า det(A)=0 แล้ว A เป็นอย่างไร?','If det(A)=0, what is true of A?'],o:[['ผกผันได้','Invertible'],['ไม่มีอินเวอร์ส','Singular; no inverse'],['เป็นเมทริกซ์เอกลักษณ์','Identity'],['ไม่เป็นจัตุรัสเสมอ','Never square']],a:1,x:['ดีเทอร์มิแนนต์เป็นศูนย์หมายถึงเมทริกซ์เอกฐาน ไม่มีอินเวอร์ส','A zero determinant means A is singular and has no inverse.']},

function mxAugmentSolve(A){if(A[0].length<2)throw Error('ใส่เมทริกซ์เสริม [A|b] โดยหลักสุดท้ายเป็นค่าด้านขวาของสมการ');const M=mxSnapshot(A),n=M[0].length-1,steps=[],pivots=[];let r=0;for(let c=0;c<n&&r<M.length;c++){let p=r;while(p<M.length&&mxZero(M[p][c]))p++;if(p==M.length)continue;if(p!==r){const before=mxSnapshot(M);[M[p],M[r]]=[M[r],M[p]];steps.push({title:`R${r+1} ↔ R${p+1}`,before,after:mxSnapshot(M),text:'สลับแถวเพื่อเลือก pivot ที่ไม่เป็นศูนย์'})}for(let i=r+1;i<M.length;i++){if(mxZero(M[i][c]))continue;const f=mxDiv(M[i][c],M[r][c]),before=mxSnapshot(M);for(let j=c;j<=n;j++)M[i][j]=mxSub(M[i][j],mxMul(f,M[r][j]));steps.push({title:`R${i+1} → R${i+1} − (${mxFmt(f)})R${r+1}`,before,after:mxSnapshot(M),text:`กำจัดตัวแปรในหลัก ${c+1} ด้านล่าง pivot`})}pivots.push(c);r++}for(const row of M)if(row.slice(0,n).every(mxZero)&&!mxZero(row[n]))return{kind:'none',steps,matrix:M,n,pivots};if(pivots.length<n)return{kind:'many',steps,matrix:M,n,pivots};const x=Array.from({length:n},()=>mxR(0));for(let i=pivots.length-1;i>=0;i--){const c=pivots[i];let v=M[i][n];for(let j=c+1;j<n;j++)v=mxSub(v,mxMul(M[i][j],x[j]));x[c]=mxDiv(v,M[i][c])}steps.push({title:'แทนค่าย้อนกลับ',after:M,text:`แก้จากแถวล่างขึ้นบน ได้ ${x.map((v,i)=>`x${i+1}=${mxFmt(v)}`).join(', ')}`});return{kind:'one',steps,matrix:M,n,x,pivots}}
function mxEigen(A){if(A.length>2||A.length!==A[0].length)throw Error('ระบบค่าเฉพาะรองรับเมทริกซ์จัตุรัส 1×1 และ 2×2 ในรุ่นนี้ เพื่อไม่แสดงคำตอบคลาดเคลื่อน');if(A.length==1)return{values:[A[0][0]],trace:mxAdd(A[0][0],mxR(0)),det:A[0][0],complex:false};const tr=mxAdd(A[0][0],A[1][1]),d=mxDet(A).value,disc=mxSub(mxMul(tr,tr),mxMul(mxR(4),d));if(disc.n<0n)return{values:[],trace:tr,det:d,complex:true,re:mxDiv(tr,mxR(2)),im:mxApproxSqrt(mxDiv(mxNeg(disc),mxR(4)))};const root=mxSqrtR(disc);return{values:[mxDiv(mxAdd(tr,root),mxR(2)),mxDiv(mxSub(tr,root),mxR(2))],trace:tr,det:d,complex:false}}
function mxApproxSqrt(x){const n=Math.sqrt(Number(x.n)/Number(x.d));if(!Number.isFinite(n))throw Error('ค่านี้ใหญ่เกินกว่าจะแสดงรากที่ไม่เป็นจำนวนตรรกยะได้อย่างปลอดภัย');return mxParse(n.toPrecision(mxState.precision+2))}
function mxSqrtR(x){if(x.n<0n)return null;const sqrtInt=n=>{if(n<2n)return n;let x0=n,y=(x0+1n)>>1n;while(y<x0){x0=y;y=(x0+n/x0)>>1n}return x0};const a=sqrtInt(x.n),b=sqrtInt(x.d);if(a*a===x.n&&b*b===x.d)return mxR(a,b);return mxApproxSqrt(x)}
function mxNullVector(A,l){const m=[[mxSub(A[0][0],l),A[0][1]],[A[1][0],mxSub(A[1][1],l)]];for(const r of m){if(!mxZero(r[0])||!mxZero(r[1]))return[mxNeg(r[1]),r[0]]}return[mxR(1),mxR(0)]}
function mxLU(A){if(A.length!==A[0].length)throw Error('LU decomposition ต้องใช้เมทริกซ์จัตุรัส');const n=A.length,U=mxSnapshot(A),L=mxIdentity(n),P=mxIdentity(n),steps=[];for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(mxAbsCmp(U[i][k],U[p][k])>0)p=i;if(mxZero(U[p][k]))throw Error('เมทริกซ์เอกฐาน จึงแยก LU แบบนี้ไม่ได้');if(p!==k){[U[p],U[k]]=[U[k],U[p]];[P[p],P[k]]=[P[k],P[p]];for(let j=0;j<k;j++)[L[p][j],L[k][j]]=[L[k][j],L[p][j]];steps.push({title:`สลับ R${k+1} ↔ R${p+1}`,after:mxSnapshot(U),text:'partial pivoting สลับแถว และสลับแถวเดียวกันใน P, L'})}for(let i=k+1;i<n;i++){const f=mxDiv(U[i][k],U[k][k]);L[i][k]=f;const before=mxSnapshot(U);for(let j=k;j<n;j++)U[i][j]=mxSub(U[i][j],mxMul(f,U[k][j]));steps.push({title:`กำจัด U${i+1}${k+1}`,before,after:mxSnapshot(U),text:`ตัวคูณ m=${mxFmt(f)}; เก็บค่านี้ไว้ใน L`})}}return{P,L,U,steps}}

function mxCompute(){try{mxRead('A');const A=mxState.A,op=mxState.op;let B=null,steps=[],matrix=null,final='',formula='',problem='',note='';if(['add','sub','mul'].includes(op))B=mxRead('B');const size=A.length;if(op=='add'||op=='sub'){if(A.length!==B.length||A[0].length!==B[0].length)throw Error(mxT('การบวกและลบต้องใช้เมทริกซ์ขนาดเท่ากัน','Addition and subtraction require equal dimensions.'));const sign=op=='add'?1:-1;matrix=A.map((r,i)=>r.map((x,j)=>sign>0?mxAdd(x,B[i][j]):mxSub(x,B[i][j])));formula=op=='add'?'C = A + B':'C = A − B';problem=`A ${op=='add'?'+':'−'} B`;for(let i=0;i<A.length;i++)for(let j=0;j<A[0].length;j++)steps.push({title:`c${i+1}${j+1} = ${mxFmt(A[i][j])} ${sign>0?'+':'−'} ${mxFmt(B[i][j])}`,text:`คำนวณสมาชิกตำแหน่งเดียวกัน ได้ ${mxFmt(matrix[i][j])}`,calc:`c${i+1}${j+1} = ${mxFmt(matrix[i][j])}`})}

function carInit(){clearInterval(carT);const t=document.querySelector('.car-track');if(!t)return;const dots=[...document.querySelectorAll('.car-dots i')];const idx=()=>Math.round(t.scrollLeft/Math.max(1,t.clientWidth));t.addEventListener('scroll',()=>{const i=idx();dots.forEach((d,k)=>d.classList.toggle('on',k==i))},{passive:true});carT=setInterval(()=>{if(!document.querySelector('.car-track'))return clearInterval(carT);const n=(idx()+1)%dots.length;t.scrollTo({left:n*t.clientWidth,behavior:'smooth'})},5000);t.addEventListener('pointerdown',()=>clearInterval(carT),{once:true})}

const EYE_ON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYE_OFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
function featPick(){const SLOT=180000,seedN=Math.floor(Date.now()/SLOT);let x=(seedN*2654435761)>>>0||1;const rnd=()=>{x|=0;x=x+0x6D2B79F5|0;let t=Math.imul(x^x>>>15,1|x);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};const pool=FEAT.filter(([k])=>k!='f');for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return [...pool.slice(0,3),...FEAT.filter(([k])=>k=='f')]}

const LG_TITLES_EN=['Propositions','Truth values','Logical connectives','Truth values of connectives','Order of precedence','Truth tables','Logical equivalence','Negation','Tautologies','Arguments and inference','Open sentences and quantifiers','Truth values of quantified statements','Equivalence and negation of quantifiers','Logic and programming'];
const LG_FNS_EN=[
()=>`<p><b>A proposition</b> is a declarative sentence that is either <b>true or false, but not both</b>.</p><div class="box">Propositions: "A cat has four legs", "The sun rises in the west", "2 + 7 > 5"</div><div class="box">Not propositions: commands, questions, requests, exclamations, e.g. "Solve 2x + 3 = 8", "Help me, please!"</div><p>A sentence with a variable that is sometimes true and sometimes false, such as "x + 3 < 5", is not a proposition either.</p>`,
()=>`<p>A <b>truth value</b> says whether a statement is correct or incorrect. There are two truth values: <b>T</b> (True) and <b>F</b> (False).</p><div class="box">"3 is a prime number" → T<br>"{1,3,5} − {1,7,8} = {3,5,7,8}" → F (the correct result is {3,5})<br>"The cube root of −8 is −2" → T<br>"7 is a solution of x² + 1 = 50" → T (49 + 1 = 50)<br>"3⁵⁵ ends in the digit 1" → F (powers of 3 end in 3, 9, 7, 1 and 55 mod 4 = 3, so it ends in 7)</div>`,
()=>`<p>Propositions are written as p, q, r, s, … Connectives join propositions into new ones.</p><div style="overflow-x:auto"><table class="t"><tr><th>Connective</th><th>Name</th><th>Symbol</th></tr><tr><td>not</td><td>Negation</td><td>~</td></tr><tr><td>and</td><td>Conjunction</td><td>∧</td></tr><tr><td>or</td><td>Disjunction</td><td>∨</td></tr><tr><td>if … then …</td><td>Conditional</td><td>→</td></tr><tr><td>… if and only if …</td><td>Biconditional</td><td>↔</td></tr></table></div><div class="box">"If 8 is even, then √8 is an integer" is written p→q<br>"2 ≠ −2 or 3 + 4 = 10" is written p∨q</div>`,
()=>`${miniTable(['~p','p∧q','p∨q','p→q','p↔q'])}<div class="box"><b>∧</b> is true in one case only: T∧T<br><b>∨</b> is false in one case only: F∨F<br><b>→</b> is false in one case only: T→F. If p is F or q is T, the conditional is true.<br><b>↔</b> is true when both sides have the same truth value.</div>`,
()=>`<p>Work out the parts in parentheses first, then apply the connectives in this order: <b>~, ∧, ∨, →, ↔</b> (~ binds most tightly, ↔ least).</p><div class="box">Example: "If 1+3&lt;5 and 5&gt;9, then 2⁰=1 or 1⁻⁵=1"<br>p = T, q = F, r = T, s = T, written as (p∧q)→(r∨s)<br>p∧q = F and r∨s = T, so F→T = <b>T</b></div><p>Some textbooks give ∧ and ∨ the same priority. This app follows ∧ before ∨ (as in JavaScript) and asks you to use parentheses when they are mixed.</p>`,
()=>`<p>With n simple propositions there are <b>2ⁿ</b> cases (1 proposition = 2 cases, 2 = 4, 3 = 8). Write the columns for the propositions first, then compute the inner parts step by step. The last column is the result.</p>${miniTable(['~p','~p∨q'])}<p>Try building truth tables for other expressions with the "Truth Table" tool.</p>`,
()=>`<p>Two propositions are <b>logically equivalent (≡)</b> when they have the same truth value in every case. To check, build a truth table for both and compare.</p><div class="box">${LAW_EN.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</div>`,
()=>`<p>The negation of p is ~p, and it has the opposite truth value in every case.</p><div class="box">~(p∧q) ≡ ~p∨~q<br>~(p∨q) ≡ ~p∧~q<br>~(p→q) ≡ p∧~q<br>~(p↔q) ≡ p↔~q</div><div class="box">Example: "If 2+4=6, then 2×3=6" has the form p→q.<br>Its negation is p∧~q: "2+4=6 and 2×3≠6".</div>`,
()=>`<p>A <b>tautology</b> is a proposition that is true in every case. There are two ways to check.</p><div class="box">1) Build a truth table. If the final column is T in every row, it is a tautology.<br>2) Assume the statement is F and work backwards. If you reach a contradiction, the statement cannot be false, so it is a tautology. If there is no contradiction, it is not a tautology.</div><p>Example: [(p→q)∧(q→r)]→(p→r) is a tautology. If p→r is F, then p = T and r = F. Then p→q is T and q→r is T, so q would have to be both T and F, which is a contradiction.</p><p>Example: [p∧(q∨r)]∨[~p∨(q∨r)] is not a tautology. It is F when p = T, q = F and r = F.</p>`,
()=>`<p>An <b>argument</b> has premises P₁, P₂, …, Pₙ and a conclusion C. It is <b>valid</b> when (P₁∧P₂∧…∧Pₙ)→C is a tautology: whenever all premises are true, the conclusion must be true.</p><div class="box">1. Modus ponens: p→q, p ⊢ q<br>2. Modus tollens: p→q, ~q ⊢ ~p<br>3. Hypothetical syllogism: p→q, q→r ⊢ p→r<br>4. Disjunctive syllogism: p∨q, ~p ⊢ q<br>5. Simplification: p∧q ⊢ p (or q)<br>6. Addition: p ⊢ p∨q<br>7. Constructive dilemma: p→r, q→s, p∨q ⊢ r∨s<br>8. Destructive dilemma: p→r, q→s, ~r∨~s ⊢ ~p∨~q</div><div class="box">"If Nary is diligent, then Nary passes the exam. Nary passes the exam. Therefore Nary is diligent." has the form [(p→q)∧q]→p. It is not a tautology (p = F, q = T makes it false), so the argument is <b>invalid</b>.</div>`,
()=>`<p>An <b>open sentence</b> contains a variable. When you substitute a member of the universe U, it becomes a proposition. There are two quantifiers.</p><div class="box"><b>∀x</b> reads "for all x"<br><b>∃x</b> reads "there exists at least one x"</div><div class="box">"Every real number x satisfies x − 3 &gt; 10" → ∀x[x − 3 &gt; 10]; U = R<br>"Some natural number x satisfies x − 1 = 0" → ∃x[x − 1 = 0]; U = N</div><p>If U is the set of all animals, "All birds have wings" = ∀x[x is a bird → x has wings], and "Some birds can fly" = ∃x[x is a bird ∧ x can fly].</p>`,
()=>`<div class="box">∀x[P(x)] is true when P(a) is true for every a in U (one false case makes it false)<br>∃x[P(x)] is true when P(a) is true for at least one a in U (one true case makes it true)</div><div class="math-display">∀x ∃y (y &gt; x)</div><p>For U = R, choose y = x + 1 for every x, so a y greater than x always exists.</p><div class="box">∀x[x + 3 &lt; 6]; U = {1,2,3,4} → <b>F</b> (x = 4 gives 7 &lt; 6, which is false)<br>∃x[x + x = x²]; U = {−1,0,1,2} → <b>T</b> (x = 0)<br>∀x ∃y (x + y ≠ 3); U = {0,1,2,4} → <b>T</b> (for every x we can find a y)<br>∃x ∀y (x + y ≠ 3); U = {0,1,2,4} → <b>T</b> (x = 0 works, because no y in U gives y = 3)</div><p>With two quantifiers, check the outer quantifier first: substitute each value of x and see whether the inner statement holds.</p>`,
()=>`<div class="box">~∀x[P(x)] ≡ ∃x[~P(x)]<br>~∃x[P(x)] ≡ ∀x[~P(x)]</div><p>With two quantifiers, swap every ∀ with ∃ and every ∃ with ∀, then put ~ in front of the open sentence.</p><div class="box">~∀x∀y[P] ≡ ∃x∃y[~P]<br>~∀x∃y[P] ≡ ∃x∀y[~P]<br>~∃x∃y[P] ≡ ∀x∀y[~P]<br>~∃x∀y[P] ≡ ∀x∃y[~P]</div><div class="box">The negation of ∀x[x &gt; 2] is ∃x[x ≤ 2]<br>The negation of "every student passed" is "some student did not pass"<br>The negation of ∃x[x + 2 ≥ 0] is ∀x[x + 2 &lt; 0]</div>`,
()=>`<p>Logic symbols map directly to JavaScript operators.</p><div style="overflow-x:auto"><table class="t"><tr><th>Logic</th><th>JavaScript</th></tr><tr><td>~p</td><td>!p</td></tr><tr><td>p∧q</td><td>p &amp;&amp; q</td></tr><tr><td>p∨q</td><td>p || q</td></tr><tr><td>p→q</td><td>!p || q</td></tr><tr><td>p↔q</td><td>p === q (for booleans)</td></tr></table></div><p>In JavaScript, <b>!</b> is evaluated first, then <b>&amp;&amp;</b>, then <b>||</b>. This matches ~, ∧, ∨ in this lesson.</p><div class="code">if (age >= 18 &amp;&amp; hasId) { /* allowed */ }\n!(a &amp;&amp; b) === (!a || !b)   // De Morgan's law</div><p><b>Short-circuit:</b> in false &amp;&amp; f(), f() is not called, and in true || f(), f() is not called either, because the result is already known (like F∧q is always F and T∨q is always T).</p><p><b>Quantifiers:</b> ∀ corresponds to every and ∃ corresponds to some.</p><div class="code">[1,2,3,4].every(x => x + 3 &lt; 6)  // false  (∀)\n[-1,0,1,2].some(x => x + x === x*x) // true   (∃)</div><p>Caution: every returns true and some returns false on an empty array.</p>`
];

function playTimeUpSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;[0,0.3,0.6].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=(d==0.6)?1046:880;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.18,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2);o.connect(g);g.connect(ctx.destination);o.start(t+d);o.stop(t+d+0.22)});setTimeout(()=>{try{ctx.close()}catch(e){}},1500)}catch(e){}}
function qTimeUp(k){const st=QST()[k];st.acc=st.lim;st.run=0;st.paused=false;st.t1=Date.now();if(k=='base'){qz.i=qz.qs.length;qFinish()}else if(k=='logic'){lq.i=lq.qs.length;finishLogic()}else{mxq.i=mxq.qs.length;finishMatrix()}playTimeUpSound();toast(QT('หมดเวลาแล้ว','Time is up'));render(false)}
function finishLogic(){const sc=lq.qs.filter((q,k)=>lq.a[k]===q.a).length;P.lat++;P.lbest=P.lbest===null?sc:Math.max(P.lbest,sc);P.act[tk()]=1;save()}
function finishMatrix(){const sc=mxq.qs.filter((q,k)=>mxq.a[k]===q.a).length;P.matrixAttempts++;P.matrixBest=P.matrixBest===null?sc:Math.max(P.matrixBest,sc);P.act[tk()]=1;save()}

 if(qz.i>=n){const sc=qz.a.filter((a,i)=>a===qz.qs[i].a).length;
  return `<section class="card"><h2>${QT('ผลคะแนน','Score')} ${sc}/${n}</h2><p class="mut">${QT('เวลาที่ใช้:','Time used:')} ${quizClock(qz,'base')}</p><div class="bar"><i style="width:${sc/n*100}%"></i></div><p>${sc>=8?QT('เยี่ยมมาก','Excellent'):sc>=5?QT('ผ่านเกณฑ์ ลองทบทวนข้อที่ผิด','Passed. Review the questions you missed'):QT('ลองทบทวนบทเรียนแล้วทำใหม่','Review the lessons and try again')}</p><button class="btn big" data-a="qstart">${QT('ทำใหม่','Try again')}</button></section>${qz.qs.map((q,i)=>`<section class="card"><b>${QT('ข้อ','Question')} ${i+1}</b> ${q.q}<p class="${qz.a[i]===q.a?'good':''}">${QT('คำตอบของคุณ:','Your answer:')} ${qz.a[i]===q.a?QT('ถูกต้อง ✓','Correct ✓'):E(q.o[qz.a[i]])+(q.b?sb(q.b):'')+' ✗'}</p><p>${QT('เฉลย:','Answer:')} <b>${E(q.o[q.a])}${q.b?sb(q.b):''}</b></p><p>${E(q.ex)}</p></section>`).join('')}`}
 const q=qz.qs[qz.i],sub=qz.a[qz.i]!==undefined,pk=sub?qz.a[qz.i]:qz.pick;

}
const KEYS=[['sin','sin(','f'],['cos','cos(','f'],['tan','tan(','f'],['log','log(','f'],['ln','ln(','f'],['sin⁻¹','asin(','f'],['cos⁻¹','acos(','f'],['tan⁻¹','atan(','f'],['√','√(','f'],['x²','²','f'],['xʸ','^','f'],['n!','!','f'],['π','π','f'],['e','e','f'],['Ans','Ans','f'],['(','(','o'],[')',')','o'],['%','%','o'],['÷','÷','o'],['AC','AC','ac'],['7','7',''],['8','8',''],['9','9',''],['×','×','o'],['DEL','DEL','o'],['4','4',''],['5','5',''],['6','6',''],['−','−','o'],['abs','abs(','f'],['1','1',''],['2','2',''],['3','3',''],['+','+','o'],['EXP','×10^','f'],['0','0',''],['.','.',''],['MODE','MODE','f',1],['=','=','eq',2]];

function doConv(){
 syncChips();

 if(e){o.innerHTML=`<div class="bad" role="alert">${e}</div>`;lastRes='';lastConv=null;rb.innerHTML='ผลลัพธ์: <b>—</b>';return}
 const x=explain(raw,f,t,+$('#dp').value||4);lastRes=x.res;lastConv={s:raw,f,t,r:x.res};
 P.conv++;P.days[tk()]=(P.days[tk()]||0)+1;P.act[tk()]=1;save();
 rb.innerHTML=`ผลลัพธ์: <b>${E(raw)}${sb(f)} = ${E(x.res)}${sb(t)}</b>`;
 o.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">ขั้นตอนการคำนวณ</h2><button class="btn s" data-a="copy">คัดลอกผลลัพธ์</button></div><div class="bigline">${E(raw)}${sb(f)} → ${E(x.res)}${sb(t)}</div><div class="box">สูตร: ${E(x.fo)}</div>${steps(x.L)}<h3>ทำไมจึงคำนวณแบบนี้</h3><p>${E(x.why)}</p>${x.nt?`<p>${E(x.nt)}</p>`:''}<h3>ตรวจสอบย้อนกลับ</h3><p>${x.exact?`นำ ${E(x.res)}${sb(t)} แปลงกลับเป็นฐาน ${f} ได้ ${E(x.back)}${sb(f)} ${x.okv?'<span class="good">ตรงกับตัวเลขเดิม ✓</span>':'ไม่ตรงกับตัวเลขเดิม ✗'}`:`แปลงกลับเป็นฐาน 10 ได้ประมาณ ${E(x.back)} ${x.okv?'<span class="good">ผลตรงกับการคำนวณแบบแม่นตรง ✓</span>':'✗'}`}</p><div class="sumok"><span class="ck2" aria-hidden="true">✓</span><div><small>สรุป:</small><b>${E(raw)}${sb(f)} เท่ากับ ${E(x.res)}${sb(t)}</b></div></div><button class="btn big" data-a="save">บันทึกผล</button></section>`;
