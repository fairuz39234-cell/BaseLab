['ค่าความจริงของตัวเชื่อม',()=>`${miniTable(['~p','p∧q','p∨q','p→q','p↔q'])}<div class="box"><b>∧</b> จริงเพียงกรณีเดียว คือ T∧T<br><b>∨</b> เท็จเพียงกรณีเดียว คือ F∨F<br><b>→</b> เท็จเพียงกรณีเดียว คือ T→F (ตัวหน้าเป็น F หรือตัวหลังเป็น T จะจริงเสมอ)<br><b>↔</b> จริงเมื่อสองประพจน์มีค่าความจริงเหมือนกัน</div>`,[['p→q','']]],
['ลำดับความสำคัญของตัวเชื่อม',()=>`<p>หาค่าในวงเล็บก่อน แล้วคำนวณตามลำดับ <b>~, ∧, ∨, →, ↔</b> (~ ผูกแน่นที่สุด ↔ ครอบคลุมที่สุด)</p><div class="box">ตัวอย่าง: “ถ้า 1+3&lt;5 และ 5&gt;9 ดังนั้น 2⁰=1 หรือ 1⁻⁵=1”<br>p = T, q = F, r = T, s = T เขียนเป็น (p∧q)→(r∨s)<br>p∧q = F, r∨s = T จึงได้ F→T = <b>T</b></div><p>เอกสารบางหน้าให้ ∧ กับ ∨ มีลำดับเท่ากัน เครื่องมือในแอปนี้ใช้ ∧ ก่อน ∨ (เหมือน JavaScript) และให้ใส่วงเล็บเมื่อใช้ปนกันเพื่อไม่ให้กำกวม</p>`,[['(p∧q)→(r∨s)','']]],
['ตารางค่าความจริง',()=>`<p>ถ้ามีประพจน์ย่อย n ตัว จะมี <b>2ⁿ</b> กรณี (1 ตัว = 2, 2 ตัว = 4, 3 ตัว = 8) เขียนคอลัมน์ตัวแปรก่อน แล้วคำนวณประพจน์ย่อยจากในวงเล็บออกมา คอลัมน์สุดท้ายคือผลลัพธ์</p>${miniTable(['~p','~p∨q'])}<p>ลองสร้างตารางของนิพจน์อื่นได้ที่เมนู “ตารางค่าความจริง”</p>`,[['(p∨q)∧(r→q)','']]],
['การสมมูลของประพจน์',()=>`<p>ประพจน์สองประพจน์ <b>สมมูลกัน (≡)</b> เมื่อมีค่าความจริงเหมือนกันทุกกรณี ตรวจโดยสร้างตารางค่าความจริงเทียบกัน</p><div class="box">${LAW.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</div>`,[['p→q','~p∨q'],['~(p∧q)','~p∨~q']]],
['นิเสธของประพจน์',()=>`<p>นิเสธของ p คือ ~p มีค่าความจริงตรงข้ามกันทุกกรณี</p><div class="box">~(p∧q) ≡ ~p∨~q<br>~(p∨q) ≡ ~p∧~q<br>~(p→q) ≡ p∧~q<br>~(p↔q) ≡ p↔~q</div><div class="box">ตัวอย่าง: “ถ้า 2+4=6 แล้ว 2×3=6” อยู่ในรูป p→q<br>นิเสธคือ p∧~q: “2+4=6 และ 2×3≠6”</div>`,[['~(p→q)','p∧~q']]],
['สัจนิรันดร์',()=>`<p><b>สัจนิรันดร์</b> คือรูปแบบประพจน์ที่เป็นจริงทุกกรณี ตรวจได้ 2 วิธี</p><div class="box">1) สร้างตารางค่าความจริง ถ้าคอลัมน์สุดท้ายเป็น T ทั้งหมดคือสัจนิรันดร์<br>2) สมมติว่าเป็น F แล้วหาค่าประพจน์ย่อย ถ้าขัดแย้งกันแสดงว่าเป็นเท็จไม่ได้ จึงเป็นสัจนิรันดร์ ถ้าไม่ขัดแย้งก็ไม่เป็น</div><p>ตัวอย่าง [(p→q)∧(q→r)]→(p→r) เป็นสัจนิรันดร์ (ถ้า p→r เป็น F ต้องได้ p = T, r = F แต่ p→q และ q→r เป็น T ทำให้ q ต้องเป็นทั้ง T และ F จึงขัดแย้ง) ส่วน [p∧(q∨r)]∨[~p∨(q∨r)] ไม่เป็นสัจนิรันดร์ เพราะเป็น F ได้เมื่อ p = T, q = F, r = F</p>`,[['[(p→q)∧(q→r)]→(p→r)',''],['[p∧(q∨r)]∨[~p∨(q∨r)]','']]],
['การอ้างเหตุผล',()=>`<p>การอ้างเหตุผลมี <b>เหตุ</b> (P₁, P₂, …) และ <b>ผล</b> (C) จะ <b>สมเหตุสมผล</b> เมื่อ (P₁∧P₂∧…)→C เป็นสัจนิรันดร์ นั่นคือถ้าเหตุจริงทั้งหมด ผลต้องจริง</p><div class="box">1. เหตุจริง–ผลจริง: p→q, p ⊢ q<br>2. ผลเท็จ–เหตุเท็จ: p→q, ~q ⊢ ~p<br>3. ถ่ายทอด: p→q, q→r ⊢ p→r<br>4. ตัดออก: p∨q, ~p ⊢ q<br>5. การลด: p∧q ⊢ p (หรือ q)<br>6. การเพิ่ม: p ⊢ p∨q<br>7. Constructive: p→r, q→s, p∨q ⊢ r∨s<br>8. Destructive: p→r, q→s, ~r∨~s ⊢ ~p∨~q</div><div class="box">“ถ้านารีขยัน แล้วนารีสอบได้ที่ 1; นารีสอบได้ที่ 1; ดังนั้นนารีขยัน” คือ [(p→q)∧q]→p ไม่เป็นสัจนิรันดร์ (p = F, q = T) จึง <b>ไม่สมเหตุสมผล</b></div>`,[['[(p→q)∧q]→p',''],['[(p→q)∧(q→r)∧~r]→~p','']]],
['ประโยคเปิดและตัวบ่งปริมาณ',()=>`<p><b>ประโยคเปิด</b> คือประโยคที่มีตัวแปร เมื่อแทนค่าด้วยสมาชิกในเอกภพสัมพัทธ์ (U) แล้วได้ประพจน์ ตัวบ่งปริมาณมี 2 ชนิด</p><div class="box"><b>∀x</b> อ่านว่า “สำหรับทุก x”<br><b>∃x</b> อ่านว่า “มี x อย่างน้อยหนึ่งตัว”</div><div class="box">“จำนวนจริง x ทุกจำนวนทำให้ x − 3 &gt; 10” → ∀x[x − 3 &gt; 10]; U = R<br>“มีจำนวนนับ x ที่ x − 1 = 0” → ∃x[x − 1 = 0]; U = N</div><p>ถ้า U เป็นเซตของสัตว์ทั้งหมด “นกทุกตัวมีปีก” = ∀x[x เป็นนก → x มีปีก] และ “นกบางตัวบินได้” = ∃x[x เป็นนก ∧ x บินได้]</p>`,[]],
['ค่าความจริงของประโยคที่มีตัวบ่งปริมาณ',()=>`<div class="box">∀x[P(x)] จริง เมื่อ P(a) จริงทุกค่า (พบเท็จตัวเดียวก็เท็จ)<br>∃x[P(x)] จริง เมื่อมี a อย่างน้อยหนึ่งตัวที่ P(a) จริง (พบจริงตัวเดียวก็จริง)</div><div class="box">∀x[x + 3 &lt; 6]; U = {1,2,3,4} → <b>F</b> (x = 4 ได้ 7 &lt; 6 เป็นเท็จ)<br>∃x[x + x = x²]; U = {−1,0,1,2} → <b>T</b> (x = 0)<br>∀x∃y[x + y ≠ 3]; U = {0,1,2,4} → <b>T</b> (ทุก x หา y ได้)<br>∃x∀y[x + y ≠ 3]; U = {0,1,2,4} → <b>T</b> (x = 0 เพราะไม่มี y = 3 ใน U)</div><p>กรณี 2 ตัว ให้พิจารณาทีละตัวจากซ้ายไปขวา เช่น ∀x∃y: แทน x ทีละค่า แล้วดูว่า ∃y เป็นจริงทุกค่า x หรือไม่</p>`,[]],
['การสมมูลและนิเสธของตัวบ่งปริมาณ',()=>`<div class="box">~∀x[P(x)] ≡ ∃x[~P(x)]<br>~∃x[P(x)] ≡ ∀x[~P(x)]</div><p>สำหรับตัวบ่งปริมาณ 2 ตัว ให้เปลี่ยน ∀ เป็น ∃ และ ∃ เป็น ∀ ทุกตัว แล้วใส่ ~ หน้าประโยคเปิด</p><div class="box">~∀x∀y[P] ≡ ∃x∃y[~P]<br>~∀x∃y[P] ≡ ∃x∀y[~P]<br>~∃x∃y[P] ≡ ∀x∀y[~P]<br>~∃x∀y[P] ≡ ∀x∃y[~P]</div><div class="box">นิเสธของ ∀x[x &gt; 2] คือ ∃x[x ≤ 2]<br>นิเสธของ “นักเรียนทุกคนสอบผ่าน” คือ “มีนักเรียนบางคนสอบไม่ผ่าน”<br>นิเสธของ ∃x[x + 2 ≥ 0] คือ ∀x[x + 2 &lt; 0]</div><p>ประโยคเปิดสมมูลกันได้เหมือนประพจน์ เช่น ∀x[P(x)→Q(x)] ≡ ∀x[~Q(x)→~P(x)] ≡ ∀x[~P(x)∨Q(x)]</p>`,[]],
['ตรรกศาสตร์กับการเขียนโปรแกรม',()=>`<div class="tblwrap"><table class="t"><tr><th>ตรรกศาสตร์</th><th>JavaScript</th></tr><tr><td>~p</td><td>!p</td></tr><tr><td>p∧q</td><td>p &amp;&amp; q</td></tr><tr><td>p∨q</td><td>p || q</td></tr><tr><td>p→q</td><td>!p || q</td></tr><tr><td>p↔q</td><td>p === q (เมื่อเป็น boolean)</td></tr></table></div><p>ลำดับใน JavaScript คือ <b>!</b> ก่อน <b>&amp;&amp;</b> ก่อน <b>||</b> ตรงกับลำดับ ~, ∧, ∨ ในบทเรียน</p><div class="code">if (age >= 18 &amp;&amp; hasId) { /* ผ่าน */ }\n!(a &amp;&amp; b) === (!a || !b)   // กฎของเดอมอร์แกน</div><p><b>Short-circuit:</b> false &amp;&amp; f() ไม่เรียก f() และ true || f() ก็ไม่เรียก f() เพราะผลแน่นอนแล้ว (เหมือน F∧q เป็น F เสมอ และ T∨q เป็น T เสมอ)</p><p><b>ตัวบ่งปริมาณ:</b> ∀ ตรงกับ every และ ∃ ตรงกับ some</p><div class="code">[1,2,3,4].every(x => x + 3 &lt; 6)  // false  (∀)\n[-1,0,1,2].some(x => x + x === x*x) // true   (∃)</div><p>ข้อควรระวัง: อาร์เรย์ว่าง every ได้ true และ some ได้ false</p>`,[['p→q','!p||q'],['~(p∧q)','!p||!q']]]];
const LQ=[
{q:'ข้อใดเป็นประพจน์',o:['x + 3 < 5','กรุณาปิดประตู','2 + 7 > 5','เขาเป็นนักคณิตศาสตร์'],a:2,ex:'2 + 7 > 5 บอกได้ว่าเป็นจริง ส่วนข้ออื่นเป็นประโยคเปิดหรือคำขอร้อง'},
{q:'p เป็นจริง q เป็นเท็จ ค่าความจริงของ p∧q คือข้อใด',o:['T','F'],a:1,ex:'∧ จริงเฉพาะเมื่อทั้งสองจริง T∧F = F'},
{q:'p→q เป็นเท็จเมื่อใด',o:['p เป็น T และ q เป็น F','p เป็น F และ q เป็น T','p และ q เป็น F','p และ q เป็น T'],a:0,ex:'→ เท็จเพียงกรณีเดียว คือ T→F'},
{q:'p เป็นเท็จ q เป็นเท็จ ค่าความจริงของ p↔q คือข้อใด',o:['T','F'],a:0,ex:'↔ จริงเมื่อสองประพจน์มีค่าความจริงเหมือนกัน F↔F = T'},
{q:'ข้อใดสมมูลกับ p→q',o:['q→p','~p∨q','p∧~q','~q→p'],a:1,ex:'p→q ≡ ~p∨q (ตรวจด้วยตารางค่าความจริงได้ในเมนูตารางค่าความจริง)'},
{q:'นิเสธของ p→q คือข้อใด',o:['~p→~q','p∧~q','~p∧q','q→p'],a:1,ex:'~(p→q) ≡ ~(~p∨q) ≡ p∧~q'},
{q:'ข้อใดเป็นสัจนิรันดร์',o:['p∧~p','p∨~p','p→~p','p∧q'],a:1,ex:'p∨~p เป็นจริงทุกกรณี ไม่ว่า p จะเป็น T หรือ F'},
{q:'เหตุ: ถ้านารีขยัน แล้วนารีสอบได้ที่ 1 / นารีสอบได้ที่ 1  ผล: นารีขยัน การอ้างเหตุผลนี้เป็นอย่างไร',o:['สมเหตุสมผล','ไม่สมเหตุสมผล'],a:1,ex:'อยู่ในรูป [(p→q)∧q]→p เป็นเท็จได้เมื่อ p = F, q = T จึงไม่เป็นสัจนิรันดร์'},
{q:'นิเสธของ ∀x[x > 2] เมื่อ U = R คือข้อใด',o:['∃x[x < 2]','∀x[x ≤ 2]','∃x[x ≤ 2]','∀x[x < 2]'],a:2,ex:'เปลี่ยน ∀ เป็น ∃ แล้วกลับประโยคเปิด: ~(x > 2) คือ x ≤ 2'},
{q:'!(a && b) ใน JavaScript เท่ากับข้อใด',o:['!a && !b','!a || !b','a || b','!a && b'],a:1,ex:'กฎของเดอมอร์แกน ~(p∧q) ≡ ~p∨~q'}];
const logicList=()=>`<div class="sec">บทเรียนตรรกศาสตร์ทั้งหมด</div>`+LG.map((l,i)=>`<button class="les${P.ll[i]?' dn':''}" data-a="ll" data-k="${i}"><span class="lic">${ico('learn')}</span><span class="lt"><b>${LWD('บทที่')} ${i+1}: ${l[0]}</b><small>${P.ll[i]?'เรียนจบแล้ว':'ยังไม่ทำเครื่องหมายว่าเรียนจบ'}</small></span>${P.ll[i]?'<span class="ck" aria-label="เรียนจบ">✓</span>':''}</button>`).join('');
const logicLesson=()=>{const i=ll_,l=LG[i];return `<section class="card lb"><button class="btn s" data-a="llback">← รายการบทเรียน</button><h2 style="margin-top:14px">${LWD('บทที่')} ${i+1} ${l[0]}</h2>${l[1]()}${l[2].length?`<h3>ลองในเครื่องมือ</h3><div class="chips">${l[2].map(([a,b])=>`<button class="chip" data-a="ltry" data-e="${E(a)}" data-e2="${E(b)}">${E(a)}${b?' ≡? '+E(b):''}</button>`).join('')}</div>`:''}<div class="row" style="margin-top:14px">${i>0?`<button class="btn s" data-a="ll" data-k="${i-1}">← บทก่อนหน้า</button>`:''}<button class="btn s" data-a="lldone">${P.ll[i]?'เรียนจบแล้ว ✓':'ทำเครื่องหมายว่าเรียนจบ'}</button>${i<LG.length-1?`<button class="btn" data-a="ll" data-k="${i+1}">บทถัดไป →</button>`:`<button class="btn" data-a="ltq">ไปทำแบบฝึกหัด</button>`}</div></section>`};
function lquizView(){const T=subTabs();if(!lq)return T+`<section class="card"><h2>แบบฝึกหัดตรรกศาสตร์</h2><p>${LQ.length} ข้อ เลือกตอบแล้วตรวจคำตอบพร้อมเฉลยทันที</p><p>คะแนนสูงสุดของคุณ: ${P.lbest===null?'ยังไม่มี':P.lbest+'/'+LQ.length}</p><button class="btn big" data-a="lqstart">เริ่มทำแบบฝึกหัด</button></section>`;
 const n=lq.qs.length;if(lq.i>=n){const sc=lq.qs.filter((q,k)=>lq.a[k]===q.a).length;return T+`<section class="card"><h2>ผลคะแนน ${sc}/${n}</h2><div class="bar"><i style="width:${sc/n*100}%"></i></div><button class="btn big" data-a="lqstart">ทำใหม่</button></section>`+lq.qs.map((q,k)=>`<section class="card"><b>ข้อ ${k+1}</b> ${E(q.q)}<p class="${lq.a[k]===q.a?'good':''}">คำตอบของคุณ: ${E(q.o[lq.a[k]])} ${lq.a[k]===q.a?'✓':'✗'}</p><p>เฉลย: <b>${E(q.o[q.a])}</b></p><p>${E(q.ex)}</p></section>`).join('')}
 const q=lq.qs[lq.i],sb2=lq.sub,pk=lq.pk;return T+`<section class="card"><span class="qchip">ข้อ ${lq.i+1}/${n}</span><div class="bar"><i style="width:${lq.i/n*100}%"></i></div><div class="qq">${E(q.q)}</div>${q.o.map((o,k)=>`<button class="opt${sb2?(k===q.a?' ok':k===pk?' no':''):(k===pk?' sel':'')}" data-a="lqsel" data-k="${k}"${sb2?' disabled':''}>${'ABCD'[k]}) ${E(o)}</button>`).join('')}${sb2?`<div class="hint"><div><b>${pk===q.a?'ถูกต้อง':'ยังไม่ถูกต้อง'}</b> ${E(q.ex)}</div></div><button class="btn big" data-a="lqnext">${lq.i+1<n?'ข้อถัดไป':'ดูผลคะแนน'}</button>`:`<button class="btn big" data-a="lqsubmit"${pk===undefined?' disabled':''}>ส่งคำตอบ</button>`}</section>`}
function lAct(a,d){
 if(lAct2(a,d))return 1;
 if(a=='tool'){go(d.k);return 1}
 if(a=='sub'){sub=d.k;ll_=null;render(false);return 1}
 if(a=='ll'){ll_=+d.k;render(true);return 1}
 if(a=='llback'){ll_=null;render(true);return 1}
 if(a=='lldone'){if(P.ll[ll_])delete P.ll[ll_];else{P.ll[ll_]=1;P.act[tk()]=1}save();render(false);return 1}
 if(a=='ltq'){sub='logic';lq=null;go('quiz');return 1}
 if(a=='ltry'){tte=[d.e,d.e2||''];go('tt');return 1}

function carInit(){clearInterval(carT);const t=document.querySelector('.car-track');if(!t)return;const dots=[...document.querySelectorAll('.car-dots i')];const idx=()=>Math.round(t.scrollLeft/Math.max(1,t.clientWidth));t.addEventListener('scroll',()=>{const i=idx();dots.forEach((d,k)=>d.classList.toggle('on',k==i))},{passive:true});carT=setInterval(()=>{if(!document.querySelector('.car-track'))return clearInterval(carT);const n=(idx()+1)%dots.length;t.scrollTo({left:n*t.clientWidth,behavior:'smooth'})},5000);t.addEventListener('pointerdown',()=>clearInterval(carT),{once:true})}

const FEAT=[['b',0],['l',0],['b',3],['l',2],['f',0]];
function carHTML(){const GR=['linear-gradient(135deg,#34D399,#059669)','linear-gradient(135deg,#F472B6,#E11D48)','linear-gradient(135deg,#60A5FA,#2563EB)','linear-gradient(135deg,#FB923C,#EA580C)','linear-gradient(135deg,#A78BFA,#7C3AED)'];const FBURL='https://www.facebook.com/share/1MV3uHiT43/?mibextid=wwXIfr';const sl=FEAT.map(([k,i],n)=>{const st=`style="background:${GR[n%GR.length]}"`;const ill='';if(k=='f')return `<a class="car-slide statp" ${st} href="${FBURL}" target="_blank" rel="noopener">${ill}<small>Facebook</small><div class="lt2">ดูโพสต์ล่าสุดบน Facebook</div><p class="mut">เปิดหน้าโพสต์ในแท็บใหม่</p><small>เปิดลิงก์ →</small></a>`;const isB=k=='b';const L=isB?(LESSONS[i]||LESSONS[0]):LG[i];const t=isB?L.t:L[0];const tag=isB?'เลขฐาน':'ตรรกศาสตร์';const body=isB?(L.b||'').slice(0,90)+'…':'เรียนรู้ทีละขั้นตอนพร้อมตัวอย่าง';return `<section class="car-slide statp" ${st} data-a="lsl" data-k="${k}" data-li="${i}" role="button" tabindex="0">${ill}<small>${tag}</small><div class="lt2">${E(t)}</div><p class="mut">${E(body)}</p><small>อ่านบทเรียน →</small></section>`}).join('');return `<div class="car" id="car"><div class="car-track">${sl}</div><div class="car-dots">${FEAT.map((_,n)=>`<i class="${n==0?'on':''}"></i>`).join('')}</div></div>`}

const LG_TITLES_EN=['Propositions','Truth values','Logical connectives','Truth values of connectives','Order of precedence','Truth tables','Logical equivalence','Negation','Tautologies','Arguments and inference','Open sentences and quantifiers','Truth values of quantified statements','Equivalence and negation of quantifiers','Logic and programming'];
const LG_FNS_EN=[
()=>`<p><b>A proposition</b> is a declarative sentence that is either <b>true or false, but not both</b>.</p><div class="box">Propositions: "A cat has four legs", "The sun rises in the west", "2 + 7 > 5"</div><div class="box">Not propositions: commands, questions, requests, exclamations, e.g. "Solve 2x + 3 = 8", "Help me, please!"</div><p>A sentence with a variable that is sometimes true and sometimes false, such as "x + 3 < 5", is not a proposition either.</p>`,
()=>`<p>A <b>truth value</b> says whether a statement is correct or incorrect. There are two truth values: <b>T</b> (True) and <b>F</b> (False).</p><div class="box">"3 is a prime number" → T<br>"{1,3,5} − {1,7,8} = {3,5,7,8}" → F (the correct result is {3,5})<br>"The cube root of −8 is −2" → T<br>"7 is a solution of x² + 1 = 50" → T (49 + 1 = 50)<br>"3⁵⁵ ends in the digit 1" → F (powers of 3 end in 3, 9, 7, 1 and 55 mod 4 = 3, so it ends in 7)</div>`,
()=>`<p>Propositions are written as p, q, r, s, … Connectives join propositions into new ones.</p><div style="overflow-x:auto"><table class="t"><tr><th>Connective</th><th>Name</th><th>Symbol</th></tr><tr><td>not</td><td>Negation</td><td>~</td></tr><tr><td>and</td><td>Conjunction</td><td>∧</td></tr><tr><td>or</td><td>Disjunction</td><td>∨</td></tr><tr><td>if … then …</td><td>Conditional</td><td>→</td></tr><tr><td>… if and only if …</td><td>Biconditional</td><td>↔</td></tr></table></div><div class="box">"If 8 is even, then √8 is an integer" is written p→q<br>"2 ≠ −2 or 3 + 4 = 10" is written p∨q</div>`,
()=>`${miniTable(['~p','p∧q','p∨q','p→q','p↔q'])}<div class="box"><b>∧</b> is true in one case only: T∧T<br><b>∨</b> is false in one case only: F∨F<br><b>→</b> is false in one case only: T→F. If p is F or q is T, the conditional is true.<br><b>↔</b> is true when both sides have the same truth value.</div>`,
()=>`<p>Work out the parts in parentheses first, then apply the connectives in this order: <b>~, ∧, ∨, →, ↔</b> (~ binds most tightly, ↔ least).</p><div class="box">Example: "If 1+3&lt;5 and 5&gt;9, then 2⁰=1 or 1⁻⁵=1"<br>p = T, q = F, r = T, s = T, written as (p∧q)→(r∨s)<br>p∧q = F and r∨s = T, so F→T = <b>T</b></div><p>Some textbooks give ∧ and ∨ the same priority. This app follows ∧ before ∨ (as in JavaScript) and asks you to use parentheses when they are mixed.</p>`,
()=>`<p>With n simple propositions there are <b>2ⁿ</b> cases (1 proposition = 2 cases, 2 = 4, 3 = 8). Write the columns for the propositions first, then compute the inner parts step by step. The last column is the result.</p>${miniTable(['~p','~p∨q'])}<p>Try building truth tables for other expressions with the "Truth Table" tool.</p>`,
()=>`<p>Two propositions are <b>logically equivalent (≡)</b> when they have the same truth value in every case. To check, build a truth table for both and compare.</p><div class="box">${LAW_EN.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</div>`,
()=>`<p>The negation of p is ~p, and it has the opposite truth value in every case.</p><div class="box">~(p∧q) ≡ ~p∨~q<br>~(p∨q) ≡ ~p∧~q<br>~(p→q) ≡ p∧~q<br>~(p↔q) ≡ p↔~q</div><div class="box">Example: "If 2+4=6, then 2×3=6" has the form p→q.<br>Its negation is p∧~q: "2+4=6 and 2×3≠6".</div>`,
()=>`<p>A <b>tautology</b> is a proposition that is true in every case. There are two ways to check.</p><div class="box">1) Build a truth table. If the final column is T in every row, it is a tautology.<br>2) Assume the statement is F and work backwards. If you reach a contradiction, the statement cannot be false, so it is a tautology. If there is no contradiction, it is not a tautology.</div><p>Example: [(p→q)∧(q→r)]→(p→r) is a tautology. If p→r is F, then p = T and r = F. Then p→q is T and q→r is T, so q would have to be both T and F, which is a contradiction.</p><p>Example: [p∧(q∨r)]∨[~p∨(q∨r)] is not a tautology. It is F when p = T, q = F and r = F.</p>`,
()=>`<p>An <b>argument</b> has premises P₁, P₂, …, Pₙ and a conclusion C. It is <b>valid</b> when (P₁∧P₂∧…∧Pₙ)→C is a tautology: whenever all premises are true, the conclusion must be true.</p><div class="box">1. Modus ponens: p→q, p ⊢ q<br>2. Modus tollens: p→q, ~q ⊢ ~p<br>3. Hypothetical syllogism: p→q, q→r ⊢ p→r<br>4. Disjunctive syllogism: p∨q, ~p ⊢ q<br>5. Simplification: p∧q ⊢ p (or q)<br>6. Addition: p ⊢ p∨q<br>7. Constructive dilemma: p→r, q→s, p∨q ⊢ r∨s<br>8. Destructive dilemma: p→r, q→s, ~r∨~s ⊢ ~p∨~q</div><div class="box">"If Nary is diligent, then Nary passes the exam. Nary passes the exam. Therefore Nary is diligent." has the form [(p→q)∧q]→p. It is not a tautology (p = F, q = T makes it false), so the argument is <b>invalid</b>.</div>`,
()=>`<p>An <b>open sentence</b> contains a variable. When you substitute a member of the universe U, it becomes a proposition. There are two quantifiers.</p><div class="box"><b>∀x</b> reads "for all x"<br><b>∃x</b> reads "there exists at least one x"</div><div class="box">"Every real number x satisfies x − 3 &gt; 10" → ∀x[x − 3 &gt; 10]; U = R<br>"Some natural number x satisfies x − 1 = 0" → ∃x[x − 1 = 0]; U = N</div><p>If U is the set of all animals, "All birds have wings" = ∀x[x is a bird → x has wings], and "Some birds can fly" = ∃x[x is a bird ∧ x can fly].</p>`,
()=>`<div class="box">∀x[P(x)] is true when P(a) is true for every a in U (one false case makes it false)<br>∃x[P(x)] is true when P(a) is true for at least one a in U (one true case makes it true)</div><div class="box">∀x[x + 3 &lt; 6]; U = {1,2,3,4} → <b>F</b> (x = 4 gives 7 &lt; 6, which is false)<br>∃x[x + x = x²]; U = {−1,0,1,2} → <b>T</b> (x = 0)<br>∀x∃y[x + y ≠ 3]; U = {0,1,2,4} → <b>T</b> (for every x we can find a y)<br>∃x∀y[x + y ≠ 3]; U = {0,1,2,4} → <b>T</b> (x = 0 works, because no y in U gives y = 3)</div><p>With two quantifiers, check the outer quantifier first: substitute each value of x and see whether the inner statement holds.</p>`,
()=>`<div class="box">~∀x[P(x)] ≡ ∃x[~P(x)]<br>~∃x[P(x)] ≡ ∀x[~P(x)]</div><p>With two quantifiers, swap every ∀ with ∃ and every ∃ with ∀, then put ~ in front of the open sentence.</p><div class="box">~∀x∀y[P] ≡ ∃x∃y[~P]<br>~∀x∃y[P] ≡ ∃x∀y[~P]<br>~∃x∃y[P] ≡ ∀x∀y[~P]<br>~∃x∀y[P] ≡ ∀x∃y[~P]</div><div class="box">The negation of ∀x[x &gt; 2] is ∃x[x ≤ 2]<br>The negation of "every student passed" is "some student did not pass"<br>The negation of ∃x[x + 2 ≥ 0] is ∀x[x + 2 &lt; 0]</div>`,
()=>`<p>Logic symbols map directly to JavaScript operators.</p><div style="overflow-x:auto"><table class="t"><tr><th>Logic</th><th>JavaScript</th></tr><tr><td>~p</td><td>!p</td></tr><tr><td>p∧q</td><td>p &amp;&amp; q</td></tr><tr><td>p∨q</td><td>p || q</td></tr><tr><td>p→q</td><td>!p || q</td></tr><tr><td>p↔q</td><td>p === q (for booleans)</td></tr></table></div><p>In JavaScript, <b>!</b> is evaluated first, then <b>&amp;&amp;</b>, then <b>||</b>. This matches ~, ∧, ∨ in this lesson.</p><div class="code">if (age >= 18 &amp;&amp; hasId) { /* allowed */ }\n!(a &amp;&amp; b) === (!a || !b)   // De Morgan's law</div><p><b>Short-circuit:</b> in false &amp;&amp; f(), f() is not called, and in true || f(), f() is not called either, because the result is already known (like F∧q is always F and T∨q is always T).</p><p><b>Quantifiers:</b> ∀ corresponds to every and ∃ corresponds to some.</p><div class="code">[1,2,3,4].every(x => x + 3 &lt; 6)  // false  (∀)\n[-1,0,1,2].some(x => x + x === x*x) // true   (∃)</div><p>Caution: every returns true and some returns false on an empty array.</p>`
];

 P.conv++;P.days[tk()]=(P.days[tk()]||0)+1;P.act[tk()]=1;save();
 rb.innerHTML=`ผลลัพธ์: <b>${E(raw)}${sb(f)} = ${E(x.res)}${sb(t)}</b>`;
 o.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">ขั้นตอนการคำนวณ</h2><button class="btn s" data-a="copy">คัดลอกผลลัพธ์</button></div><div class="bigline">${E(raw)}${sb(f)} → ${E(x.res)}${sb(t)}</div><div class="box">สูตร: ${E(x.fo)}</div>${steps(x.L)}<h3>ทำไมจึงคำนวณแบบนี้</h3><p>${E(x.why)}</p>${x.nt?`<p>${E(x.nt)}</p>`:''}<h3>ตรวจสอบย้อนกลับ</h3><p>${x.exact?`นำ ${E(x.res)}${sb(t)} แปลงกลับเป็นฐาน ${f} ได้ ${E(x.back)}${sb(f)} ${x.okv?'<span class="good">ตรงกับตัวเลขเดิม ✓</span>':'ไม่ตรงกับตัวเลขเดิม ✗'}`:`แปลงกลับเป็นฐาน 10 ได้ประมาณ ${E(x.back)} ${x.okv?'<span class="good">ผลตรงกับการคำนวณแบบแม่นตรง ✓</span>':'✗'}`}</p><div class="sumok"><span class="ck2" aria-hidden="true">✓</span><div><small>สรุป:</small><b>${E(raw)}${sb(f)} เท่ากับ ${E(x.res)}${sb(t)}</b></div></div><button class="btn big" data-a="save">บันทึกผล</button></section>`;
}
function doCalc(){
 const a=$('#ca').value.trim().toUpperCase(),b=$('#cb').value.trim().toUpperCase(),B=+$('#cs').value,op=$('#op').value,o=$('#out');
 const e=/\./.test(a+b)?'บวกและลบรองรับเฉพาะจำนวนเต็ม (ไม่มีจุดทศนิยม)':err(a,B)?'จำนวนที่ 1: '+err(a,B):err(b,B)?'จำนวนที่ 2: '+err(b,B):'';
 if(e){o.innerHTML=`<div class="bad" role="alert">${e}</div>`;return}
 o.innerHTML=`<section class="card"><h2>วิธีคำนวณ</h2>${calcHtml(a,b,B,op)}</section>`;
}
function chkLesson(){
 const l=LESSONS[lesson],v=$('#ans').value.trim().toUpperCase(),okk=l.a.some(x=>x.toUpperCase()==v||(x=='ไม่'&&v=='ไม่')),o=$('#fb2');
 if(!v){o.innerHTML='<div class="bad">กรุณากรอกคำตอบ</div>';return}
 if(okk){o.innerHTML='<p class="good">ถูกต้อง ✓ ทำเครื่องหมายว่าเรียนจบแล้ว</p>';P.lessons[lesson]=true;P.act[tk()]=1;save()}
 else o.innerHTML=`<div class="bad">ยังไม่ถูกต้อง ลองทบทวนวิธีทำด้านบน (เฉลย: ${E(l.a[0])})</div>`;
}
function qFinish(){const sc=qz.a.filter((a,i)=>a===qz.qs[i].a).length;P.attempts++;P.best=P.best===null?sc:Math.max(P.best,sc);P.hist.push({s:sc,t:Date.now()});P.hist=P.hist.slice(-10);P.act[tk()]=1;save()}
document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('setm'))closeDlg(e.target);if(!e.target.closest('#qm,.fab'))qmToggle(false);const b=e.target.closest('button,[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;if(lAct(a,d))return;if(a=='setpop'){setPop(true);return}if(a=='setx'){setPop(false);return}if(a=='theme'){setTheme(d.k);return}if(a=='animset'){setAnim(d.k=='1');return}
 if(d.p){go(d.p);return}if(d.go){qmToggle(false);go(d.go);return}if(d.sk!==undefined){skey(d.sk);return}
 if(a=='conv')doConv();
 else if(a=='swap'){const f=$('#fb'),t=$('#tb'),i=$('#in'),x=f.value;f.value=t.value;t.value=x;if(lastRes){i.value=lastRes}doConv()}
 else if(a=='clr'){$('#in').value='';$('#out').innerHTML='';$('#rbx').innerHTML='ผลลัพธ์: <b>—</b>';lastRes='';lastConv=null;$('#in').focus()}
 else if(a=='ex'){$('#in').value=d.s;$('#fb').value=d.f;$('#tb').value=d.t;doConv()}
 else if(a=='copy'){if(lastRes)copyTxt(lastRes)}
 else if(a=='try'){pending=[d.s,d.f,d.t];go('conv')}
 else if(a=='fb'){$('#fb').value=d.b;syncChips()}
 else if(a=='tb'){$('#tb').value=d.b;syncChips()}
 else if(a=='save'){if(lastConv){P.saved.unshift({...lastConv,ts:Date.now()});P.saved=P.saved.slice(0,30);P.act[tk()]=1;save();toast('บันทึกผลแล้ว')}}
 else if(a=='fab')qmToggle($('#qm').hidden)
 else if(a=='calc')doCalc();
 else if(a=='calcclr'){$('#ca').value='';$('#cb').value='';$('#out').innerHTML=''}
 else if(a=='les'){lesson=+d.k;render(true)}
 else if(a=='back'){lesson=null;render(true)}
 else if(a=='chk')chkLesson();
 else if(a=='done'){P.lessons[lesson]=true;P.act[tk()]=1;save();render(false);toast('บันทึกแล้ว')}
 else if(a=='qstart'){qz={qs:shuf([...shuf(BANK.slice()).slice(0,7).map(mkB),...[5,6,4].map(mkQ)]),i:0,a:[]};render(false);window.scrollTo(0,0)}
 else if(a=='qsel'){if(qz.a[qz.i]===undefined){qz.pick=+d.k;render(false)}}
 else if(a=='qsubmit'){if(qz.pick!==undefined&&qz.a[qz.i]===undefined){qz.a[qz.i]=qz.pick;render(false)}}
 else if(a=='qnext'){qz.i++;qz.pick=undefined;if(qz.i>=qz.qs.length)qFinish();render(false);window.scrollTo(0,0)}
 else if(a=='reset'){if(confirm('ล้างความคืบหน้าทั้งหมด?')){P=Object.assign(P0(),{theme:P.theme,noanim:P.noanim});save();render(false)}}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){qmToggle(false);document.querySelectorAll('.setm:not([hidden])').forEach(closeDlg)}if(e.key!='Enter')return;const id=e.target.id;if(id=='te'||id=='te2')lAct('ttgo',{});else if(id=='in')doConv();else if(id=='ca'||id=='cb')doCalc();else if(id=='ans')chkLesson();else if(id=='sx')sEval()});
document.addEventListener('change',e=>{if(e.target.id=='bk'&&e.target.value){const[a,f,t]=e.target.value.split('|');$('#in').value=a;$('#fb').value=f;$('#tb').value=t;doConv()}});
$('#nav').innerHTML=PG.flatMap(p=>TOOLS.includes(p[0])?(p[0]=='conv'?[['tools','เครื่องมือ']]:[]):[p]).map(p=>`<button data-p="${p[0]}">${ico(p[0])}${p[1]}</button>`).join('');
$('#tab').innerHTML=TB.map(([p,l])=>p=='fab'?`<button class="fab" data-a="fab" aria-label="เมนูลัด" aria-expanded="false">${ico('plus')}</button>`:`<button data-p="${p}">${ico(p)}<span>${l}</span></button>`).join('');
$('#qm').innerHTML=[['prog','ความคืบหน้า'],['set','ตั้งค่า']].map(([p,t])=>`<button data-go="${p}">${ico(p)}${t}</button>`).join('');
(()=>{const sp=$('#splash');let seen=false;try{seen=sessionStorage.getItem('bl.sp')=='1'}catch(e){}if(seen){sp.remove();return}$('#spgo').onclick=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),450);try{sessionStorage.setItem('bl.sp','1')}catch(e){}}})();
setAnim(!(P.noanim||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)));
$('#fav').href=$('#logo').src;$('#gear').innerHTML=ico('set');$('#srch').innerHTML=ico('srch');trDom();applyTheme();
window.addEventListener('hashchange',route);route();
</script>
