<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BaseLab ระบบเรียนรู้และแปลงเลขฐาน</title>
<link rel="icon" id="fav" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#5B21B6;--c2:#7B5CFF;--c3:#A78BFA;--c4:#C4B5FD;--c5:#EDE9FE;--ink:#1F2937;--mut:#6B7280;--ln:#ddd6fe;--g:linear-gradient(135deg,#7B5CFF,#5B21B6);--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 'Kanit','Sarabun',system-ui,sans-serif;color:var(--ink);background:radial-gradient(60% 40% at 0 0,var(--c5),transparent 70%),radial-gradient(50% 40% at 100% 25%,#d9ccff,transparent 70%),linear-gradient(160deg,#f3eeff,#e8e0ff);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:12px;align-self:start;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:26px;padding:20px 12px;color:#fff;background:radial-gradient(120% 50% at 0 0,rgba(255,255,255,.22),transparent 60%),linear-gradient(170deg,#7B5CFF,#5B21B6);box-shadow:0 14px 34px rgba(91,33,182,.28);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.mark{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--c1);display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:20px;line-height:1.1}.brand small{opacity:.8;font-size:12px}
#nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:rgba(255,255,255,.88);padding:11px 14px;border-radius:14px;cursor:pointer;text-align:left;transition:background .15s,transform .12s}
#nav button:hover{background:rgba(255,255,255,.14)}
#nav button:active,.tab button:active{transform:scale(.97)}
#nav button[aria-current=page],.tab button[aria-current=page]{background:#fff;color:var(--c1);font-weight:600}
.ic{width:20px;height:20px;flex:none}
main{padding:12px 16px 40px;max-width:1000px;width:100%;margin:0 auto;min-width:0}
.top{border-radius:24px;padding:18px 24px;color:#fff;background:radial-gradient(60% 140% at 0 0,rgba(255,255,255,.2),transparent 60%),var(--g);box-shadow:0 10px 26px rgba(91,33,182,.24);margin-bottom:18px}
.top h1{margin:0;font-size:24px}.top p{margin:2px 0 0;opacity:.85;font-size:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px rgba(123,92,255,.1)}
.card h2{margin:0 0 10px;font-size:19px}.card h3{margin:14px 0 6px;font-size:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.grid .card{margin:0}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--g);color:#fff;box-shadow:0 6px 16px rgba(123,92,255,.28);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.s{background:#fff;color:var(--c2);border:1px solid var(--c4);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--c4);border-radius:12px;background:#fff;min-height:44px}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
.f{flex:1;min-width:130px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--c4);background:var(--c5);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.res{font-size:30px;font-weight:700;color:var(--c1);word-break:break-all}
.steps{list-style:none;margin:8px 0;padding:0}
.steps li{padding:7px 12px;margin:6px 0;border-left:4px solid var(--c3);background:#f6f3ff;border-radius:0 12px 12px 0;word-break:break-word}
.box{background:var(--c5);border-radius:14px;padding:10px 14px;margin:8px 0}
.bad{background:#fdeaea;color:#a02525;border-radius:14px;padding:12px 14px}
.good{color:#12805c;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--c4);border-radius:14px;background:#fff;cursor:pointer;transition:transform .12s,background .15s}
.opt:hover:not(:disabled){background:var(--c5)}.opt:active:not(:disabled){transform:scale(.99)}
.opt.ok{background:#e2f6ee;border-color:#12805c}.opt.no{background:#fdeaea;border-color:#c0392b}
.bar{height:10px;border-radius:99px;background:var(--c5);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),var(--c2));border-radius:99px;transition:width .5s var(--e)}
.les{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--ln);background:#fff;border-radius:16px;padding:12px 16px;margin:8px 0;cursor:pointer;transition:transform .12s,box-shadow .2s}
.les:hover{box-shadow:0 6px 18px rgba(123,92,255,.15)}.les:active{transform:scale(.99)}
.view.anim{animation:rise .3s var(--e)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.tab{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--c1);color:#fff;padding:9px 18px;border-radius:99px;z-index:50}
#toast[hidden]{display:none}
@media(max-width:720px){.app{display:block}aside{display:none}main{padding:8px 12px 110px}.top{border-radius:0 0 24px 24px;margin:-8px -12px 16px;padding:18px 20px}.tab{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:linear-gradient(135deg,#7B5CFF,#5B21B6);border-radius:28px;padding:6px;box-shadow:0 14px 30px rgba(91,33,182,.4)}.tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:rgba(255,255,255,.9);font-size:10px;padding:6px 0;border-radius:22px;min-width:0;cursor:pointer}.tab .ic{width:21px;height:21px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.logo{width:44px;height:44px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.25);flex:none}
.logo.big{width:76px;height:76px;border-radius:20px;display:block;margin-bottom:10px;box-shadow:0 10px 24px rgba(123,92,255,.35)}
.top{display:flex;align-items:center;gap:12px}.top .logo.sm{display:none;width:46px;height:46px}
.grid .card{border-top:5px solid var(--c2)}.grid .card:nth-child(2){border-top-color:#14B8A6}.grid .card:nth-child(3){border-top-color:#F97316}.grid .card:nth-child(4){border-top-color:#22C55E}
table.t{border-collapse:collapse;width:100%;text-align:center}table.t th,table.t td{border:1px solid var(--ln);padding:4px 8px}table.t th{background:var(--c5)}
.sx{font-size:22px;text-align:right;min-height:56px}
.sr{min-height:46px;text-align:right;font-size:28px;font-weight:600;color:var(--c1);margin:6px 2px 12px;word-break:break-all}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.key{border:1px solid var(--c4);background:#fff;border-radius:14px;min-height:46px;font-size:16px;cursor:pointer;transition:transform .1s,background .15s}
.key:hover{background:var(--c5)}.key:active{transform:scale(.95)}
.key.f{background:var(--c5);font-size:14px}.key.o{background:#ede9fe;color:var(--c1)}.key.eq{background:var(--g);color:#fff;border:0;font-size:22px}.key.ac{background:#fee2e2;border-color:#fecaca}
@media(max-width:720px){.top .logo.sm{display:block}}
html,body{max-width:100%;overflow-x:hidden}
.card p,.card li,.steps li,.box{overflow-wrap:anywhere}
aside{overflow-y:auto}
.key{min-width:0;padding:0}
.top>div{min-width:0}
@media(max-width:720px){
main{padding:8px 10px 108px}
.top{margin:-8px -10px 14px;padding:16px;gap:10px}.top h1{font-size:20px;line-height:1.3}.top p{font-size:13px}
.card{padding:16px;border-radius:20px}
.res{font-size:26px}
.btn{min-height:44px;padding:9px 16px}
.chip{padding:8px 14px}
.kp{gap:6px}.key{min-height:48px;font-size:17px}.key.f{font-size:12.5px}.key.eq{font-size:22px}
.sx{font-size:20px}.sr{font-size:24px}
table.t{font-size:13px}table.t th,table.t td{padding:3px 4px}
.tab{left:8px;right:8px;padding:5px}
.tab button{font-size:10px;padding:6px 0;letter-spacing:-.2px;overflow:hidden;white-space:nowrap}
.tab .ic{width:20px;height:20px}
}
@media(max-width:380px){.tab button{font-size:9px}.tab .ic{width:18px;height:18px}.key.f{font-size:11.5px}.card{padding:14px}.top h1{font-size:18px}}

:root{--ln:#E5DEFF}
body{background:radial-gradient(45% 30% at 8% 4%,rgba(123,92,255,.22),transparent 70%),radial-gradient(45% 30% at 96% 45%,rgba(123,92,255,.16),transparent 70%),#E8E0FF}
aside{background:#4C1D95;box-shadow:0 14px 34px rgba(76,29,149,.38);border-radius:28px}
#nav button[aria-current=page]{background:#6D28D9;color:#fff}
.top{background:none;box-shadow:none;color:var(--ink);padding:6px 4px 0;margin-bottom:12px}
.top h1{font-size:26px;color:var(--ink)}.top p{color:var(--mut);opacity:1}
.tg{margin-left:auto;border:1.5px solid #C4B5FD;background:#fff;color:var(--c1);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;flex:none}
.card{border:0;border-radius:24px;box-shadow:0 8px 24px rgba(123,92,255,.12)}
.card h2{font-size:20px}
.btn{background:#7B5CFF;border-radius:16px;box-shadow:0 8px 18px rgba(123,92,255,.3)}
.btn.s{background:#fff;color:#7B5CFF;border:1.5px solid #C4B5FD;box-shadow:none}
.btn.big{display:block;width:100%;padding:14px;font-size:17px;border-radius:18px;margin-top:12px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
input,select{border:1.5px solid var(--ln);background:#F8F6FF;border-radius:14px}
.mut{color:var(--mut);margin:8px 0 0;font-size:14px}
.sr-only,.hid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.bchips{display:flex;gap:8px}
.bc{flex:1;min-width:0;border:1.5px solid #1F2937;background:#fff;border-radius:14px;padding:9px 4px;font-weight:500;cursor:pointer;transition:transform .12s,background .15s}
.bc:active{transform:scale(.96)}
.bc.on{background:#7B5CFF;border-color:#7B5CFF;color:#fff;box-shadow:0 6px 14px rgba(123,92,255,.35)}
.resbox{background:#E9E3FF;border-radius:16px;padding:14px;font-size:18px;margin:16px 0 0;overflow-wrap:anywhere}
.more{margin-top:14px}.more summary{cursor:pointer;color:var(--c1);font-weight:500}
.bigline{font-size:26px;font-weight:600;color:var(--c1);margin:10px 0;overflow-wrap:anywhere}
.steps{counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:12px 14px 12px 54px;border:0;background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(123,92,255,.1);margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#7B5CFF;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.sumok{display:flex;gap:12px;align-items:center;background:#22C55E;color:#fff;border-radius:18px;padding:14px 16px;margin-top:14px}
.sumok small{display:block;opacity:.9}.sumok b{font-size:17px;overflow-wrap:anywhere}
.ck2{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:#22C55E;display:grid;place-items:center;font-weight:700}
.hello{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.hello b{display:block;font-size:20px;line-height:1.2}.hello small{color:var(--mut)}
.statp{background:linear-gradient(135deg,#7B5CFF,#5B21B6);color:#fff;border-radius:24px;padding:18px;margin:0 0 14px;box-shadow:0 12px 26px rgba(91,33,182,.3)}
.statp .big{font-size:26px;font-weight:600;line-height:1.3}.statp small{opacity:.9}
.stat4{display:none}
.s4{border-radius:20px;padding:14px;color:#fff}.s4 small{display:block;opacity:.9}.s4 b{font-size:24px}
.s4.p{background:#7B5CFF}.s4.t{background:#14B8A6}.s4.o{background:#F97316}.s4.y{background:#FBBF24;color:#422006}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;text-align:left;border:0;border-radius:22px;padding:14px;min-height:132px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:0 10px 22px rgba(0,0,0,.12);transition:transform .2s,box-shadow .2s;animation:rise .45s var(--e) backwards}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.18)}.tile:active{transform:scale(.97)}
.tile b{font-size:18px;line-height:1.2}.tile small{opacity:.92;font-size:13px}
.ti{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.24);display:grid;place-items:center}
.ta{position:absolute;right:14px;top:10px;font-size:24px;opacity:.85}
.t1{background:linear-gradient(135deg,#7B5CFF,#5B21B6)}.t2{background:linear-gradient(135deg,#14B8A6,#0D9488)}.t3{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.t4{background:linear-gradient(135deg,#F97316,#EA580C)}.t5{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#422006}.t6{background:linear-gradient(135deg,#22C55E,#16A34A)}
.two{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}.two .card{margin:0}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}.li b{overflow-wrap:anywhere}.li small{color:var(--mut);white-space:nowrap}
.wk{display:flex;align-items:flex-end;gap:8px;height:150px}
.wb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}
.wb i{display:block;width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:#7B5CFF;transform-origin:bottom}
.wb:nth-child(even) i{background:#14B8A6}
.wb span{font-size:11px;color:var(--mut);min-height:14px}.wb small{font-size:12px;color:var(--mut)}
@keyframes grow{from{transform:scaleY(0)}}
#v.anim .wb i{animation:grow .7s var(--e) backwards}
.rg{position:relative;width:170px;height:170px;margin:6px auto}.rg svg{width:100%;height:100%}
.rgt{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;color:var(--c1)}
@keyframes ring{from{stroke-dasharray:0 400}}
#v.anim .rgf{animation:ring 1.2s var(--e)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats3>div{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 6px 16px rgba(123,92,255,.1)}
.stats3 b{display:block;font-size:18px}.stats3 small{color:var(--mut);font-size:12.5px}
.sec{font-weight:600;margin:16px 2px 6px}
.hi{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;margin:10px 0}
.hic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;flex:none}
.hi small{display:block;color:#4B5563}
.hi.g{background:#BBF7D0}.hi.o{background:#FED7AA}.hi.p{background:#E9E3FF}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:20px;padding:12px;margin:10px 0;background:#fff;box-shadow:0 6px 16px rgba(123,92,255,.1);cursor:pointer}
.lic{width:48px;height:48px;border-radius:14px;background:#7B5CFF;color:#fff;display:grid;place-items:center;flex:none}
.les.cur{background:#99F6E4}.les.cur .lic{background:#14B8A6}
.les.qz{background:#FDE68A}.les.qz .lic{background:#FBBF24;color:#422006}
.lt{flex:1;min-width:0}.lt b{display:block;font-size:15px;line-height:1.35}.lt small{color:#4B5563;font-size:12.5px}
.ck{width:28px;height:28px;border-radius:50%;background:#22C55E;color:#fff;display:grid;place-items:center;flex:none}
.qchip{display:inline-block;background:#7B5CFF;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;margin-bottom:10px}
.qq{background:#FED7AA;border-radius:16px;padding:12px 14px;font-weight:500;margin:12px 0}
.opt{border:0;background:#E5E7EB;border-radius:16px;padding:14px;font-size:18px;font-weight:500;margin:10px 0}
.opt:hover:not(:disabled){background:#DDD6FE}
.opt.sel{background:#7B5CFF;color:#fff}
.opt.ok{background:#22C55E;color:#fff;animation:pulse .5s}
.opt.no{background:#FCA5A5;animation:shake .4s}
.opt:disabled{opacity:1;cursor:default}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{display:flex;gap:10px;align-items:flex-start;background:#FDE68A;border-radius:16px;padding:12px 14px;margin:12px 0}
.hint .ic{flex:none;color:#92400E}
.key{border:0;background:#F3EFFF}.key.f{background:#E9E3FF}.key.o{background:#DDD6FE}.key.eq{background:#7B5CFF}.key.ac{background:#FEE2E2}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(165deg,#7B5CFF,#5B21B6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));transition:opacity .4s,transform .4s}
.splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
.sp-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo.xl{width:104px;height:104px;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.3);animation:pop .7s cubic-bezier(.34,1.56,.64,1) both,breathe 3s ease-in-out .8s infinite}
.splash h1{font-size:44px;margin:16px 0 0;color:#fff;animation:rise .5s .25s both}
.splash p{margin:4px 0 0;opacity:.92;font-size:17px;animation:rise .5s .35s both}
.sp-btn{width:100%;max-width:360px;border:0;border-radius:18px;background:#fff;color:#5B21B6;font-size:18px;font-weight:600;padding:15px;cursor:pointer;animation:pop .5s .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fabf{0%,100%{transform:translateY(-22px)}50%{transform:translateY(-27px)}}
.qm{display:none}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}

.qm[hidden]{display:none}

.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}

 P.conv++;P.days[tk()]=(P.days[tk()]||0)+1;P.act[tk()]=1;save();
 rb.innerHTML=`ผลลัพธ์: <b>${E(raw)}${sb(f)} = ${E(x.res)}${sb(t)}</b>`;
 o.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">ขั้นตอนการคำนวณ</h2><button class="btn s" data-a="copy">คัดลอกผลลัพธ์</button></div><div class="bigline">${E(raw)}${sb(f)} → ${E(x.res)}${sb(t)}</div><div class="box">สูตร: ${E(x.fo)}</div>${steps(x.L)}<h3>ทำไมจึงคำนวณแบบนี้</h3><p>${E(x.why)}</p>${x.nt?`<p>${E(x.nt)}</p>`:''}<h3>ตรวจสอบย้อนกลับ</h3><p>${x.exact?`นำ ${E(x.res)}${sb(t)} แปลงกลับเป็นฐาน ${f} ได้ ${E(x.back)}${sb(f)} ${x.okv?'<span class="good">ตรงกับตัวเลขเดิม ✓</span>':'ไม่ตรงกับตัวเลขเดิม ✗'}`:`แปลงกลับเป็นฐาน 10 ได้ประมาณ ${E(x.back)} ${x.okv?'<span class="good">ผลตรงกับการคำนวณแบบแม่นตรง ✓</span>':'✗'}`}</p><div class="sumok"><span class="ck2" aria-hidden="true">✓</span><div><small>สรุป:</small><b>${E(raw)}${sb(f)} เท่ากับ ${E(x.res)}${sb(t)}</b></div></div><button class="btn big" data-a="save">บันทึกผล</button></section>`;
}
function doCalc(){
 const a=$('#ca').value.trim().toUpperCase(),b=$('#cb').value.trim().toUpperCase(),B=+$('#cs').value,op=$('#op').value,o=$('#out');
 const e=/\./.test(a+b)?'บวกและลบรองรับเฉพาะจำนวนเต็ม (ไม่มีจุดทศนิยม)':err(a,B)?'จำนวนที่ 1: '+err(a,B):err(b,B)?'จำนวนที่ 2: '+err(b,B):'';
 if(e){o.innerHTML=`<div class="bad" role="alert">${e}</div>`;return}
 o.innerHTML=`<section class="card"><h2>วิธีคำนวณ</h2>${calcHtml(a,b,B,op)}</section>`;
}
function chkLesson(){
 const l=LESSONS[lesson],v=$('#ans').value.trim().toUpperCase(),okk=l.a.some(x=>x.toUpperCase()==v||(x=='ไม่'&&v=='ไม่')),o=$('#fb2');
 if(!v){o.innerHTML='<div class="bad">กรุณากรอกคำตอบ</div>';return}
 if(okk){o.innerHTML='<p class="good">ถูกต้อง ✓ ทำเครื่องหมายว่าเรียนจบแล้ว</p>';P.lessons[lesson]=true;P.act[tk()]=1;save()}
 else o.innerHTML=`<div class="bad">ยังไม่ถูกต้อง ลองทบทวนวิธีทำด้านบน (เฉลย: ${E(l.a[0])})</div>`;
}
function qFinish(){const sc=qz.a.filter((a,i)=>a===qz.qs[i].a).length;P.attempts++;P.best=P.best===null?sc:Math.max(P.best,sc);P.hist.push({s:sc,t:Date.now()});P.hist=P.hist.slice(-10);P.act[tk()]=1;save()}
document.addEventListener('click',e=>{
 if(!e.target.closest('#qm,.fab'))qmToggle(false);const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,d=b.dataset;if(b.id=='anim'){setAnim(document.body.classList.contains('noanim'));return}
 if(d.p){go(d.p);return}if(d.go){qmToggle(false);go(d.go);return}if(d.sk!==undefined){skey(d.sk);return}
 if(a=='conv')doConv();
 else if(a=='swap'){const f=$('#fb'),t=$('#tb'),i=$('#in'),x=f.value;f.value=t.value;t.value=x;if(lastRes){i.value=lastRes}doConv()}
 else if(a=='clr'){$('#in').value='';$('#out').innerHTML='';$('#rbx').innerHTML='ผลลัพธ์: <b>—</b>';lastRes='';lastConv=null;$('#in').focus()}
 else if(a=='ex'){$('#in').value=d.s;$('#fb').value=d.f;$('#tb').value=d.t;doConv()}
 else if(a=='copy'){if(lastRes)copyTxt(lastRes)}
 else if(a=='try'){pending=[d.s,d.f,d.t];go('conv')}
 else if(a=='fb'){$('#fb').value=d.b;syncChips()}
 else if(a=='tb'){$('#tb').value=d.b;syncChips()}
 else if(a=='save'){if(lastConv){P.saved.unshift({...lastConv,ts:Date.now()});P.saved=P.saved.slice(0,30);P.act[tk()]=1;save();toast('บันทึกผลแล้ว')}}
 else if(a=='fab')qmToggle($('#qm').hidden)
 else if(a=='calc')doCalc();
 else if(a=='calcclr'){$('#ca').value='';$('#cb').value='';$('#out').innerHTML=''}
 else if(a=='les'){lesson=+d.k;render(true)}
 else if(a=='back'){lesson=null;render(true)}
 else if(a=='chk')chkLesson();
 else if(a=='done'){P.lessons[lesson]=true;P.act[tk()]=1;save();render(false);toast('บันทึกแล้ว')}
 else if(a=='qstart'){qz={qs:shuf([...shuf(BANK.slice()).slice(0,7).map(mkB),...[5,6,4].map(mkQ)]),i:0,a:[]};render(false);window.scrollTo(0,0)}
 else if(a=='qsel'){if(qz.a[qz.i]===undefined){qz.pick=+d.k;render(false)}}
 else if(a=='qsubmit'){if(qz.pick!==undefined&&qz.a[qz.i]===undefined){qz.a[qz.i]=qz.pick;render(false)}}
 else if(a=='qnext'){qz.i++;qz.pick=undefined;if(qz.i>=qz.qs.length)qFinish();render(false);window.scrollTo(0,0)}
 else if(a=='reset'){if(confirm('ล้างความคืบหน้าทั้งหมด?')){P=P0();save();render(false)}}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape')qmToggle(false);if(e.key!='Enter')return;const id=e.target.id;if(id=='in')doConv();else if(id=='ca'||id=='cb')doCalc();else if(id=='ans')chkLesson();else if(id=='sx')sEval()});
document.addEventListener('change',e=>{if(e.target.id=='bk'&&e.target.value){const[a,f,t]=e.target.value.split('|');$('#in').value=a;$('#fb').value=f;$('#tb').value=t;doConv()}});
$('#nav').innerHTML=PG.map(p=>`<button data-p="${p[0]}">${ico(p[0])}${p[1]}</button>`).join('');
$('#tab').innerHTML=TB.map(([p,l])=>p=='fab'?`<button class="fab" data-a="fab" aria-label="เมนูลัด" aria-expanded="false">${ico('plus')}</button>`:`<button data-p="${p}">${ico(p)}<span>${l}</span></button>`).join('');
$('#qm').innerHTML=[['calc','บวกและลบเลขฐาน'],['sci','เครื่องคิดเลขวิทยาศาสตร์'],['prog','ความคืบหน้า']].map(([p,t])=>`<button data-go="${p}">${ico(p)}${t}</button>`).join('');
(()=>{const sp=$('#splash');let seen=false;try{seen=sessionStorage.getItem('bl.sp')=='1'}catch(e){}if(seen){sp.remove();return}$('#spgo').onclick=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),450);try{sessionStorage.setItem('bl.sp','1')}catch(e){}}})();
setAnim(!(P.noanim||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)));
$('#fav').href=$('#logo').src;
window.addEventListener('hashchange',route);route();
</script>
</body>
